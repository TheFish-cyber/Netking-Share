<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơn Tùng M-TP Playlist - Custom UI Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .outro-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        #grainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        .light-ring {
            position: absolute;
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            animation: spinRing 20s linear infinite;
            z-index: 0;
            filter: blur(40px);
        }

        .light-ring:nth-child(2) {
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
            animation-duration: 15s;
            animation-direction: reverse;
            filter: blur(50px);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        /* ===== MAIN CONTENT AREA ===== */
        .wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
        }

        .main-content {
            text-align: center;
            cursor: pointer;
            user-select: none;
            margin-bottom: 15px;
        }

        .main-text {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4);
            position: relative;
            display: inline-block;
        }

        .sub-line {
            margin-top: 5px;
            font-size: clamp(0.7rem, 1.8vw, 1.1rem);
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.8;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 5px;
            display: inline-block;
        }

        .char {
            display: inline-block;
            min-width: 0.7em;
            text-align: center;
            color: #fff;
        }

        /* ===== CUSTOM PLAYER PANEL ===== */
        .player-panel {
            width: 100%;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(12px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .now-playing {
            font-size: 0.85rem;
            color: #ffd700;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 12px #ffd700;
        }

        /* Search Bar */
        .search-box {
            width: 100%;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        /* Custom Playlist UI */
        .custom-playlist {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.4);
        }

        .custom-playlist::-webkit-scrollbar {
            width: 4px;
        }
        .custom-playlist::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 2px;
        }

        .playlist-item {
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s, color 0.2s;
        }

        .playlist-item:hover {
            background: rgba(255, 215, 0, 0.15);
            color: #fff;
        }

        .playlist-item.active {
            background: rgba(255, 215, 0, 0.25);
            color: #ffd700;
            font-weight: bold;
            border-left: 3px solid #ffd700;
        }

        /* Glitch Corner Text */
        .corner-text {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            opacity: 0.6;
            pointer-events: none;
        }

        .corner-text-left {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: clamp(0.6rem, 1vw, 0.8rem);
            color: #888;
            opacity: 0.5;
            pointer-events: none;
        }

        .glitch-active {
            animation: glitchEffect 0.3s steps(1) 1;
        }

        @keyframes glitchEffect {
            0% { transform: translate(0, 0); text-shadow: 2px 0 red, -2px 0 blue; }
            20% { transform: translate(-2px, 1px); text-shadow: -3px 0 cyan, 3px 0 magenta; }
            50% { transform: translate(2px, -1px); text-shadow: 3px 0 lime, -3px 0 red; }
            100% { transform: translate(0, 0); text-shadow: none; }
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0, 0, 0, 0.05) 3px, rgba(0, 0, 0, 0.05) 4px);
            pointer-events: none;
            z-index: 3;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            left: -9999px;
        }
    </style>
</head>
<body>

    <div class="outro-container">
        <div class="light-ring"></div>
        <div class="light-ring"></div>
        <div class="vignette"></div>
        <div class="scanline"></div>
        <canvas id="grainCanvas"></canvas>

        <div class="wrapper">
            <div class="main-content" title="Click để chạy lại Animation Glitch">
                <div class="main-text">
                    <span class="char">M</span>
                    <span style="display:inline-block; min-width:0.3em;">-</span>
                    <span class="char">T</span>
                    <span class="char">P</span>
                </div>
                <br>
                <div class="sub-line">⚡ COME MY WAY ⚡</div>
            </div>

            <div class="player-panel">
                <div class="now-playing" id="trackTitle">▶ Chọn bài hát để bắt đầu</div>
                
                <div class="controls">
                    <button class="btn" id="prevBtn">◄ PREV</button>
                    <button class="btn" id="playBtn">▶ PLAY</button>
                    <button class="btn" id="nextBtn">NEXT ►</button>
                </div>

                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm kiếm bài hát Sơn Tùng...">
                </div>

                <div class="custom-playlist" id="playlistContainer">
                    </div>
            </div>
        </div>

        <div class="corner-text" id="cornerRight">
            <span id="glitchRight">● SƠN TÙNG MTP</span>
        </div>
        <div class="corner-text-left" id="cornerLeft">
            <span id="glitchLeft">#MTP</span>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        // Danh sách nhạc YouTube
        const playlist = [
            { title: "Đừng Làm Trái Tim Anh Đau", id: "abPmZCZZrFA" },
            { title: "Chúng Ta Của Tương Lai", id: "0pWsCiO1-mE" },
            { title: "Making My Way", id: "N36-o42mDdc" },
            { title: "Chạy Ngay Đi (Run Now)", id: "32s188T70vU" },
            { title: "Hãy Trao Cho Anh", id: "knW7-J7ORjU" },
            { title: "Lạc Trôi", id: "Llw9Q6akRo4" },
            { title: "Có Chắc Yêu Là Đây", id: "c183BI__I_8" },
            { title: "Muộn Rồi Mà Sao Còn", id: "xypzmu5mMPY" },
            { title: "Chúng Ta Của Hiện Tại", id: "psZ1g9fMkyo" },
            { title: "Nơi Này Có Anh", id: "FN7ALfpGxiI" }
        ];

        let currentTrackIndex = 0;
        let player = null;
        let isPlaying = false;

        // Tải YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100',
                width: '100',
                videoId: playlist[currentTrackIndex].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': () => renderPlaylist(playlist),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                nextTrack();
            }
        }

        // DOM Elements
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        const searchInput = document.getElementById('searchInput');
        const trackTitle = document.getElementById('trackTitle');

        // Render Custom Playlist UI
        function renderPlaylist(items) {
            playlistContainer.innerHTML = '';
            if(items.length === 0) {
                playlistContainer.innerHTML = '<div style="padding:10px; text-align:center; color:#666;">Không tìm thấy bài hát</div>';
                return;
            }

            items.forEach((track) => {
                const originalIndex = playlist.findIndex(p => p.id === track.id);
                const item = document.createElement('div');
                item.className = `playlist-item ${originalIndex === currentTrackIndex ? 'active' : ''}`;
                item.innerHTML = `<span>${originalIndex + 1}. ${track.title}</span> <span>►</span>`;
                
                item.addEventListener('click', () => {
                    playTrack(originalIndex);
                });
                
                playlistContainer.appendChild(item);
            });
        }

        function playTrack(index) {
            currentTrackIndex = index;
            if (player && player.loadVideoById) {
                player.loadVideoById(playlist[currentTrackIndex].id);
                
                // Nếu trước đó đang bật thì tiếp tục tự động phát bài mới
                if (isPlaying) {
                    player.playVideo();
                } else {
                    player.pauseVideo();
                }
            }
            updateUI();
        }

        function updateUI() {
            trackTitle.textContent = `🎵 ${playlist[currentTrackIndex].title}`;
            renderPlaylist(getFilteredPlaylist());
            
            // Cuộn tới item đang active
            const activeEl = playlistContainer.querySelector('.playlist-item.active');
            if(activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function getFilteredPlaylist() {
            const query = searchInput.value.toLowerCase().trim();
            return playlist.filter(item => item.title.toLowerCase().includes(query));
        }

        // Event Listeners Cho Control
        playBtn.addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
                playBtn.textContent = '▶ PLAY';
                isPlaying = false;
            } else {
                player.playVideo();
                playBtn.textContent = '❚❚ PAUSE';
                isPlaying = true;
            }
        });

        nextBtn.addEventListener('click', () => nextTrack());
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentTrackIndex);
        });

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(currentTrackIndex);
        }

        // Tim kiem real-time
        searchInput.addEventListener('input', () => {
            renderPlaylist(getFilteredPlaylist());
        });

        // Kích hoạt Audio khi chạm vào màn hình (Tránh bị trình duyệt chặn autoplay)
        document.body.addEventListener('click', () => {
            if (player && typeof player.isMuted === 'function' && player.isMuted()) {
                player.unMute();
            }
        }, { once: true });


        // ===== GLITCH ANIMATION CHỮ M-TP TỐC ĐỘ CAO =====
        (function() {
            // Grain Canvas
            const canvas = document.getElementById('grainCanvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawGrain() {
                const w = canvas.width, h = canvas.height;
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = Math.random() * 255;
                    data[i] = data[i+1] = data[i+2] = noise;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawGrain);
            }
            drawGrain();

            // Glitch M-TP Animation
            const randomChars = '!@#$%^&*()_+-=[]{}|;:,.<>?/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const charElements = document.querySelectorAll('.char'); 
            const originalChars = ['M', 'T', 'P'];
            let isAnimating = false;

            function fastGlitchMTP() {
                if (isAnimating) return;
                isAnimating = true;

                let currentCharIndex = 0;

                function processNextChar() {
                    if (currentCharIndex >= charElements.length) {
                        isAnimating = false;
                        return;
                    }

                    const el = charElements[currentCharIndex];
                    const targetChar = originalChars[currentCharIndex];
                    let step = 0;
                    const maxSteps = 12; // Số lần nháy chữ ngẫu nhiên

                    // Đổi ký tự siêu nhanh (60ms/bước)
                    const interval = setInterval(() => {
                        if (step >= maxSteps) {
                            clearInterval(interval);
                            el.textContent = targetChar;
                            currentCharIndex++;
                            setTimeout(processNextChar, 100); // Khoảng nghỉ ngắn giữa các chữ
                            return;
                        }
                        // Lấy ngẫu nhiên ký tự trong mảng
                        el.textContent = randomChars[Math.floor(Math.random() * randomChars.length)];
                        step++;
                    }, 60);
                }

                processNextChar();
            }

            // Chạy animation ban đầu sau 1 giây
            setTimeout(fastGlitchMTP, 1000);

            // Click chữ để phát lại animation Glitch bất cứ lúc nào
            document.querySelector('.main-content').addEventListener('click', fastGlitchMTP);

            // Glitch text phụ ở góc
            const phrasesRight = ['● SƠN TÙNG MTP', '✦ COME MY WAY', '★ M-TP', '◆ SKY CƠN MƯA'];
            const elRight = document.getElementById('glitchRight');
            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % phrasesRight.length;
                elRight.textContent = phrasesRight[idx];
                elRight.classList.add('glitch-active');
                setTimeout(() => elRight.classList.remove('glitch-active'), 300);
            }, 2000);
        })();
    </script>
</body>
</html>
