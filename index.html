<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P̷̪̂ẖ̸͝o̶̩͒n̷͎̉g̷̲͗d̸̛͜ż̷̻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Playfair+Display:ital,wght@0,700;1,700&family=UnifrakturMaguntia&display=swap');

:root {
  --void:#010002; --blood:#8b0000; --blood-bright:#c41e1e;
  --blood-dark:#3a0000; --crimson-glow:#ff1a1a;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--void);
  display:flex;align-items:center;justify-content:center;
  height:100vh;overflow:hidden;
  font-family:'Orbitron',sans-serif;
  cursor:crosshair;user-select:none;-webkit-user-select:none;
  /* CONSTANT MICRO-JITTER — như Annihilation shimmer */
  animation: bodyJitter 0.08s infinite;
}
@keyframes bodyJitter{
  0%{transform:translate(0,0)}
  15%{transform:translate(-1px,0.5px)}
  30%{transform:translate(0.5px,-1px)}
  45%{transform:translate(-0.5px,-0.5px)}
  60%{transform:translate(1px,0)}
  75%{transform:translate(-0.5px,0.5px)}
  90%{transform:translate(0.5px,0)}
  100%{transform:translate(0,0)}
}

/* ── CONSTANT VIGNETTE PULSE ── */
.blood-vignette{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(1,0,2,0.9) 68%,rgba(58,0,0,0.4) 100%);
  animation:vignettePulse 0.6s infinite alternate;
}
@keyframes vignettePulse{
  0%{opacity:0.85;transform:scale(1)}
  50%{opacity:0.95;transform:scale(1.02)}
  100%{opacity:0.8;transform:scale(0.98)}
}

/* ── SCANLINES NHANH HƠN ── */
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:10;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.25) 2px,rgba(0,0,0,0.25) 4px);
}
.scanlines::after{
  content:'';position:fixed;inset:0;
  background:linear-gradient(transparent 20%,rgba(180,0,0,0.06) 50%,transparent 80%);
  animation:scanMove 2s linear infinite;pointer-events:none;
}
@keyframes scanMove{
  0%{transform:translateY(-100%)}
  100%{transform:translateY(100%)}
}

/* ── NOISE LỚP DÀY ── */
.noise{
  position:fixed;inset:0;opacity:0.08;z-index:8;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:noiseShift 0.3s infinite;
}
@keyframes noiseShift{
  0%{transform:translate(0,0)}
  33%{transform:translate(-2px,1px)}
  66%{transform:translate(1px,-2px)}
  100%{transform:translate(0,0)}
}

.water-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.06;
  background:radial-gradient(ellipse at 25% 75%,rgba(120,0,0,0.5) 0%,transparent 50%),
             radial-gradient(ellipse at 75% 25%,rgba(0,0,0,0.6) 0%,transparent 50%);
  animation:waterDrift 6s ease-in-out infinite;
}
@keyframes waterDrift{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(-15px,10px) scale(1.05)}
  50%{transform:translate(5px,-8px) scale(0.96)}
  75%{transform:translate(12px,4px) scale(1.03)}
}

/* ── ALL CANVASES ── */
#bgCanvas,#smileCanvas,#bloodCanvas,#glitchCanvas,#distortCanvas{
  position:fixed;inset:0;pointer-events:none;
}
#bgCanvas{z-index:0}#smileCanvas{z-index:3}#bloodCanvas{z-index:4}
#glitchCanvas{z-index:25}#distortCanvas{z-index:6}

/* ── VERITY SMILE POPUP ── */
.verity-smile{
  position:fixed;pointer-events:none;z-index:20;
  font-family:'Playfair Display',serif;font-style:italic;font-weight:700;
  color:var(--blood-bright);
  text-shadow:0 0 30px var(--crimson-glow),0 0 60px var(--blood-dark),0 0 100px black;
  animation:verityAppear 0.8s ease-out forwards;letter-spacing:0.3em;
}
@keyframes verityAppear{
  0%{transform:scale(0.1) rotate(-25deg);opacity:0;filter:blur(10px) brightness(5)}
  12%{transform:scale(2.8) rotate(10deg);opacity:1;filter:blur(0) brightness(2)}
  30%{transform:scale(0.8) rotate(-4deg);opacity:0.85;filter:blur(0)}
  55%{transform:scale(1.8) rotate(3deg);opacity:0.6;filter:blur(3px)}
  100%{transform:scale(4.5) rotate(-15deg);opacity:0;filter:blur(16px) brightness(0.1)}
}

/* ── CRYPTIC POPUP ── */
.cryptic-pop{
  position:fixed;pointer-events:none;z-index:22;
  font-family:'UnifrakturMaguntia','Playfair Display',serif;
  color:var(--blood-bright);
  text-shadow:0 0 35px var(--crimson-glow),0 0 70px black;
  animation:crypticBurst 0.7s ease-out forwards;
}
@keyframes crypticBurst{
  0%{transform:scale(0.05) rotate(0deg);opacity:0;filter:blur(0) brightness(6)}
  20%{transform:scale(4) rotate(30deg);opacity:1;filter:blur(0) brightness(1.8)}
  45%{transform:scale(1.5) rotate(-18deg);opacity:0.65;filter:blur(2px)}
  100%{transform:scale(7) rotate(55deg);opacity:0;filter:blur(15px) brightness(0)}
}

/* ── MAIN CONTAINER — CONSTANT JITTER ── */
.main{
  position:relative;z-index:5;text-align:center;
  animation:mainJitter 0.12s infinite, mainPulse 2s ease-in-out infinite;
}
@keyframes mainJitter{
  0%{transform:translate(0,0)}
  25%{transform:translate(0.5px,-0.5px)}
  50%{transform:translate(-0.5px,0.5px)}
  75%{transform:translate(0.3px,0.3px)}
  100%{transform:translate(0,0)}
}
@keyframes mainPulse{
  0%,100%{filter:brightness(1)}
  40%{filter:brightness(1.1) contrast(1.05)}
  80%{filter:brightness(0.95) contrast(1.02)}
}

.glitch-wrapper{
  position:relative;display:inline-block;
  /* CONSTANT MICRO-WOBBLE */
  animation:wrapperWobble 0.15s infinite;
}
@keyframes wrapperWobble{
  0%{transform:translate(0,0) scale(1)}
  20%{transform:translate(1px,0) scale(1.005)}
  40%{transform:translate(-1px,1px) scale(0.995)}
  60%{transform:translate(0.5px,-0.5px) scale(1.003)}
  80%{transform:translate(-0.5px,0) scale(0.997)}
  100%{transform:translate(0,0) scale(1)}
}

/* ── MAIN TEXT — NEVER STABLE ── */
.glitch-text{
  font-size:clamp(4rem,12vw,10rem);
  font-weight:900;letter-spacing:0.2em;
  color:#d0c8c0;
  text-shadow:
    0 0 8px rgba(180,0,0,0.7),
    0 0 25px rgba(139,0,0,0.6),
    0 0 60px rgba(100,0,0,0.4),
    0 0 120px rgba(58,0,0,0.3);
  position:relative;
  display:inline-block;
  /* CONSTANT SHAKE — không bao giờ đứng yên */
  animation:textShake 0.06s infinite, textPulse 0.8s infinite alternate;
}
@keyframes textShake{
  0%{transform:translate(0,0)}
  12%{transform:translate(2px,-1px)}
  25%{transform:translate(-1px,2px)}
  37%{transform:translate(-2px,-1px)}
  50%{transform:translate(1px,1px)}
  62%{transform:translate(-1px,-2px)}
  75%{transform:translate(2px,1px)}
  87%{transform:translate(-1px,0)}
  100%{transform:translate(0,0)}
}
@keyframes textPulse{
  0%{opacity:0.7;filter:brightness(0.8)}
  30%{opacity:1;filter:brightness(1.3)}
  60%{opacity:0.6;filter:brightness(0.7)}
  100%{opacity:0.9;filter:brightness(1.1)}
}

/* ── GLITCH CLONES — LUÔN HIỆN DIỆN ── */
.glitch-clone{
  position:absolute;top:0;left:0;width:100%;height:100%;
  font-size:clamp(4rem,12vw,10rem);
  font-weight:900;letter-spacing:0.2em;
  pointer-events:none;
  animation:cloneDrift 0.2s infinite;
}
.glitch-clone.blood{color:var(--blood-bright);opacity:0.15;}
.glitch-clone.shadow{color:#ff0000;opacity:0.1;}
.glitch-clone.void{color:#fff;opacity:0.08;}
.glitch-clone.abyss{color:#000;text-shadow:0 0 20px #8b0000;opacity:0.12;}
@keyframes cloneDrift{
  0%{transform:translate(0,0)}
  25%{transform:translate(-3px,1px)}
  50%{transform:translate(2px,-2px)}
  75%{transform:translate(-1px,-1px)}
  100%{transform:translate(0,0)}
}

.glitch-burst{
  position:absolute;top:0;left:0;width:100%;height:100%;
  font-size:clamp(4rem,12vw,10rem);
  font-weight:900;letter-spacing:0.2em;
  color:var(--blood-bright);
  pointer-events:none;
  /* CONSTANT FLASH */
  animation:burstFlash 0.25s infinite;
}
@keyframes burstFlash{
  0%{opacity:0;transform:translate(0,0) skew(0)}
  40%{opacity:0.6;transform:translate(8px,-4px) skew(3deg)}
  60%{opacity:0.8;transform:translate(-6px,3px) skew(-2deg)}
  80%{opacity:0.3;transform:translate(0,0) skew(1deg)}
  100%{opacity:0;transform:translate(0,0) skew(0)}
}

.scramble-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  font-family:'Share Tech Mono',monospace;
  font-size:clamp(4rem,12vw,10rem);
  font-weight:400;letter-spacing:0.2em;
  color:var(--crimson-glow);
  pointer-events:none;
  /* CONSTANT SCRAMBLE FLASH */
  animation:scrambleFlash 0.15s infinite;
}
@keyframes scrambleFlash{
  0%{opacity:0;transform:translate(0,0)}
  35%{opacity:0.5;transform:translate(-2px,1px)}
  65%{opacity:0.7;transform:translate(3px,-2px)}
  100%{opacity:0;transform:translate(0,0)}
}

.cryptic-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  font-size:clamp(4rem,12vw,10rem);
  font-weight:900;letter-spacing:0.2em;
  pointer-events:none;
  color:var(--blood-bright);
  text-shadow:0 0 25px var(--crimson-glow),0 0 60px black;
  animation:crypticFlash 0.3s infinite;
}
@keyframes crypticFlash{
  0%{opacity:0;transform:scale(0.9) rotate(-2deg)}
  30%{opacity:0.6;transform:scale(1.1) rotate(3deg)}
  70%{opacity:0.8;transform:scale(1.05) rotate(-1deg)}
  100%{opacity:0;transform:scale(0.95) rotate(2deg)}
}

/* ── SUBTITLE — LUÔN RUNG ── */
.subtitle{
  margin-top:1.5rem;
  font-size:clamp(0.8rem,1.6vw,1.1rem);
  font-family:'Share Tech Mono',monospace;
  letter-spacing:0.5em;
  color:var(--blood-bright);
  text-shadow:0 0 10px var(--blood-dark),0 0 30px rgba(139,0,0,0.6);
  animation:subShake 0.1s infinite, subFade 1.5s infinite alternate;
}
@keyframes subShake{
  0%{transform:translate(0,0)}
  25%{transform:translate(1px,0)}
  50%{transform:translate(-1px,1px)}
  75%{transform:translate(0.5px,-0.5px)}
  100%{transform:translate(0,0)}
}
@keyframes subFade{
  0%{opacity:0.5}
  100%{opacity:0.9}
}

/* ── SIGILS ── */
.sigil{
  position:fixed;width:100px;height:100px;z-index:5;pointer-events:none;
  animation:sigilPulse 0.8s infinite alternate;
}
.sigil::before,.sigil::after{content:'';position:absolute;background:var(--blood-dark);}
.sigil.tl{top:20px;left:20px}.sigil.tr{top:20px;right:20px}
.sigil.bl{bottom:20px;left:20px}.sigil.br{bottom:20px;right:20px}
.sigil.tl::before{top:0;left:0;width:45px;height:2px;box-shadow:0 0 10px var(--crimson-glow)}
.sigil.tl::after{top:0;left:0;width:2px;height:45px;box-shadow:0 0 10px var(--crimson-glow)}
.sigil.tr::before{top:0;right:0;width:45px;height:2px;box-shadow:0 0 10px var(--crimson-glow)}
.sigil.tr::after{top:0;right:0;width:2px;height:45px;box-shadow:0 0 10px var(--crimson-glow)}
.sigil.bl::before{bottom:0;left:0;width:45px;height:2px;box-shadow:0 0 10px var(--crimson-glow)}
.sigil.bl::after{bottom:0;left:0;width:2px;height:45px;box-shadow:0 0 10px var(--crimson-glow)}
.sigil.br::before{bottom:0;right:0;width:45px;height:2px;box-shadow:0 0 10px var(--crimson-glow)}
.sigil.br::after{bottom:0;right:0;width:2px;height:45px;box-shadow:0 0 10px var(--crimson-glow)}
@keyframes sigilPulse{
  0%{opacity:0.3}
  100%{opacity:0.7}
}

/* ── SHAKE CLASSES ── */
.shake{animation:screenShake 0.4s ease-out}
@keyframes screenShake{
  0%{transform:translate(0)}
  5%{transform:translate(-25px,16px)}
  10%{transform:translate(20px,-18px)}
  15%{transform:translate(-16px,-10px)}
  20%{transform:translate(18px,12px)}
  28%{transform:translate(-10px,-6px)}
  36%{transform:translate(7px,4px)}
  45%{transform:translate(-4px,-2px)}
  60%{transform:translate(2px,1px)}
  100%{transform:translate(0)}
}
.shake-hard{animation:screenShakeHard 0.3s ease-out}
@keyframes screenShakeHard{
  0%{transform:translate(0) scale(1)}
  6%{transform:translate(-35px,24px) scale(1.04)}
  12%{transform:translate(30px,-26px) scale(0.97)}
  18%{transform:translate(-22px,-15px) scale(1.03)}
  25%{transform:translate(25px,18px) scale(0.96)}
  35%{transform:translate(-12px,-8px) scale(1.02)}
  50%{transform:translate(6px,4px)}
  70%{transform:translate(-3px,-1px)}
  100%{transform:translate(0) scale(1)}
}

/* ── CORRUPTION / CHROME ── */
.corrupt-flash{
  position:fixed;inset:0;z-index:40;pointer-events:none;
  mix-blend-mode:difference;background:var(--blood-bright);
  opacity:0;
  /* CONSTANT MICRO FLASH */
  animation:corruptFlicker 0.1s infinite;
}
@keyframes corruptFlicker{
  0%{opacity:0}
  30%{opacity:0.08}
  60%{opacity:0.03}
  100%{opacity:0}
}
.chrome-bleed{
  position:fixed;inset:0;z-index:35;pointer-events:none;
  background:linear-gradient(90deg,rgba(200,0,0,0.2) 0%,transparent 20%,transparent 80%,rgba(0,0,0,0.35) 100%);
  animation:chromePulse 0.5s infinite alternate;
}
@keyframes chromePulse{
  0%{opacity:0.2}
  100%{opacity:0.6}
}

/* ── GLITCH BAR ── */
.glitch-bar{
  position:fixed;left:-8%;right:-8%;height:3px;
  z-index:50;pointer-events:none;opacity:0;
  background:var(--blood-bright);
  box-shadow:0 0 20px var(--crimson-glow),0 0 55px var(--blood-dark);
}

/* ── TEAR LINE ── */
.tear-line{
  position:fixed;left:0;right:0;height:2px;
  background:var(--blood-bright);
  z-index:45;pointer-events:none;opacity:0;
  box-shadow:0 0 25px var(--crimson-glow);
}

/* ── PERSONA SPLIT ── */
.persona-split{
  position:fixed;top:0;bottom:0;width:50vw;z-index:15;pointer-events:none;
  animation:personaPulse 3s infinite alternate;
}
.persona-split.left{left:0;background:linear-gradient(to right,rgba(1,0,2,0.85) 0%,transparent 100%)}
.persona-split.right{right:0;background:linear-gradient(to left,rgba(180,0,0,0.35) 0%,transparent 100%)}
@keyframes personaPulse{
  0%{opacity:0.1}
  50%{opacity:0.4}
  100%{opacity:0.15}
}

/* ── CODE RAIN ── */
.code-rain{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0.08;
  font-family:'Share Tech Mono',monospace;font-size:11px;
  color:var(--blood-bright);white-space:pre;line-height:1.2;overflow:hidden;
  animation:codeJitter 0.2s infinite;
}
@keyframes codeJitter{
  0%{transform:translate(0,0)}
  50%{transform:translate(-1px,-1px)}
  100%{transform:translate(0,0)}
}
</style>
</head>

<div class="corrupt-flash" id="corruptFlash"></div>
<div class="chrome-bleed" id="chromeBleed"></div>

<div class="water-overlay"></div>
<div class="scanlines"></div>
<div class="blood-vignette"></div>
<div class="noise"></div>
<div class="code-rain" id="codeRain"></div>
<canvas id="bgCanvas"></canvas>
<canvas id="distortCanvas"></canvas>
<canvas id="smileCanvas"></canvas>
<canvas id="bloodCanvas"></canvas>
<canvas id="glitchCanvas"></canvas>

<div class="persona-split left"></div>
<div class="persona-split right"></div>

<div class="sigil tl"></div>
<div class="sigil tr"></div>
<div class="sigil bl"></div>
<div class="sigil br"></div>

<div class="main" id="mainContainer">
  <div class="glitch-wrapper" id="glitchWrapper">

  <div class="subtitle" id="subtitleEl">// A B Y S S _ W A T C H E R</div>
</div>

<script>

//  DARK WATER DROPS — CONSTANT RAIN
// ═══════════════════════════════════════
class DarkDrop{
  constructor(){this.reset(true)}
  reset(init){
    this.x=Math.random()*W;
    this.y=init?Math.random()*H:-20;
    this.vy=0.2+Math.random()*0.8;
    this.size=Math.random()*2.5+0.3;
    this.opacity=Math.random()*0.4+0.04;
    this.wobble=Math.random()*Math.PI*2;
    this.wobbleSpeed=0.01+Math.random()*0.04;
  }
  update(){
    this.y+=this.vy;this.wobble+=this.wobbleSpeed;
    this.x+=Math.sin(this.wobble)*0.4;
    if(this.y>H+30)this.reset(false);
  }
  draw(ctx){
    ctx.fillStyle=`rgba(139,0,0,${this.opacity})`;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();
  }
}
const drops=[];for(let i=0;i<200;i++)drops.push(new DarkDrop());
function animateDrops(){
  bgCtx.clearRect(0,0,W,H);
  for(const d of drops){d.update();d.draw(bgCtx);}
  requestAnimationFrame(animateDrops);
}
animateDrops();

// ═══════════════════════════════════════
//  DISTORTION CANVAS — ANNIHILATION SHIMMER
//  (sóng méo hình như Annihilation)
// ═══════════════════════════════════════
const distortionWaves=[];
for(let i=0;i<15;i++){
  distortionWaves.push({
    x:Math.random()*W,y:Math.random()*H,
    radius:50+Math.random()*200,
    maxRadius:150+Math.random()*350,
    speed:0.5+Math.random()*2,
    opacity:0.03+Math.random()*0.08,
    phase:Math.random()*Math.PI*2,
    freq:0.02+Math.random()*0.06
  });
}
function animateDistortion(){
  distortCtx.clearRect(0,0,W,H);
  for(const w of distortionWaves){
    w.radius+=w.speed;
    if(w.radius>w.maxRadius){w.radius=30+Math.random()*80;w.x=Math.random()*W;w.y=Math.random()*H;}
    w.phase+=0.05;
    const alpha=Math.max(0,w.opacity*(1-w.radius/w.maxRadius));
    const grad=distortCtx.createRadialGradient(w.x,w.y,w.radius*0.3,w.x,w.y,w.radius);
    grad.addColorStop(0,`rgba(139,0,0,${alpha})`);
    grad.addColorStop(0.4,`rgba(80,0,0,${alpha*0.6})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    distortCtx.fillStyle=grad;
    distortCtx.beginPath();
    // Wobbly circle — như Annihilation shimmer
    distortCtx.moveTo(w.x+Math.cos(w.phase)*w.radius*0.1,w.y);
    for(let a=0;a<Math.PI*2;a+=0.1){
      const r=w.radius+Math.sin(a*6+w.phase)*w.radius*0.08+Math.cos(a*3+w.phase*2)*w.radius*0.05;
      distortCtx.lineTo(w.x+Math.cos(a)*r,w.y+Math.sin(a)*r);
    }
    distortCtx.closePath();distortCtx.fill();
  }
  requestAnimationFrame(animateDistortion);
}
animateDistortion();

// ═══════════════════════════════════════
//  VERITY SMILE — CONSTANT SPAWN
// ═══════════════════════════════════════
const drawnSmiles=[];
function spawnVeritySmile(){
  drawnSmiles.push({
    x:Math.random()*W,y:Math.random()*H,
    size:Math.random()*60+18,life:1,
    decay:0.004+Math.random()*0.018,
    rot:(Math.random()-0.5)*0.55,
    phase:Math.random()*Math.PI*2,
    flickerSpeed:0.06+Math.random()*0.2
  });
  if(drawnSmiles.length>35)drawnSmiles.shift();
}
function drawVeritySmile(ctx,x,y,size,alpha,rot,phase){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot);
  const flicker=0.5+0.5*Math.sin(phase),ga=alpha*flicker;

  const auraGrad=ctx.createRadialGradient(0,0,size*0.4,0,0,size*1.6);
  auraGrad.addColorStop(0,'rgba(0,0,0,0)');
  auraGrad.addColorStop(0.5,`rgba(139,0,0,${ga*0.5})`);
  auraGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=auraGrad;ctx.beginPath();ctx.arc(0,0,size*1.6,0,Math.PI*2);ctx.fill();

  const fg=ctx.createRadialGradient(0,-size*0.1,size*0.06,0,0,size);
  fg.addColorStop(0,`rgba(210,200,190,${alpha*0.6})`);
  fg.addColorStop(0.7,`rgba(160,150,140,${alpha*0.5})`);
  fg.addColorStop(1,`rgba(60,40,40,${alpha*0.2})`);
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,size,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle=`rgba(139,0,0,${alpha*0.55})`;ctx.lineWidth=1.5;
  ctx.shadowColor=`rgba(180,0,0,${ga*0.6})`;ctx.shadowBlur=10;ctx.stroke();

  const eyeR=size*0.15,eyeX=size*0.34,eyeY=-size*0.22;
  ctx.fillStyle=`rgba(0,0,0,${alpha})`;ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=6;
  ctx.beginPath();ctx.arc(-eyeX,eyeY,eyeR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(eyeX,eyeY,eyeR,0,Math.PI*2);ctx.fill();

  // Blood tears — CONSTANTLY DRIPPING
  ctx.shadowColor=`rgba(180,0,0,${ga})`;ctx.shadowBlur=5;
  ctx.strokeStyle=`rgba(139,0,0,${alpha*0.9})`;ctx.lineWidth=size*0.06;
  const tl=size*0.45+Math.sin(phase*4)*size*0.15;
  ctx.beginPath();ctx.moveTo(-eyeX,eyeY+eyeR);ctx.lineTo(-eyeX,eyeY+eyeR+tl);ctx.stroke();
  ctx.beginPath();ctx.moveTo(eyeX,eyeY+eyeR);ctx.lineTo(eyeX,eyeY+eyeR+tl);ctx.stroke();

  // SMILE — quá rộng, đáng sợ
  ctx.shadowColor=`rgba(180,0,0,${ga*0.7})`;ctx.shadowBlur=8;
  ctx.strokeStyle=`rgba(20,0,0,${alpha*0.9})`;ctx.lineWidth=size*0.06;
  const sY=size*0.15,sW=size*0.6;
  ctx.beginPath();ctx.arc(0,sY,sW,0.1,Math.PI-0.1);ctx.stroke();

  ctx.lineWidth=size*0.02;ctx.strokeStyle=`rgba(180,170,160,${alpha*0.4})`;ctx.shadowBlur=0;
  for(let i=0;i<7;i++){
    const a=0.22+(i/6)*(Math.PI-0.44);
    const tx=Math.cos(a)*sW,ty=sY+Math.sin(a)*sW;
    ctx.beginPath();ctx.moveTo(tx,ty-size*0.16);ctx.lineTo(tx,ty);ctx.stroke();
  }
  ctx.restore();
}
function animateSmiles(){
  smileCtx.clearRect(0,0,W,H);
  for(let i=drawnSmiles.length-1;i>=0;i--){
    const s=drawnSmiles[i];s.phase+=s.flickerSpeed;
    drawVeritySmile(smileCtx,s.x,s.y,s.size,s.life,s.rot,s.phase);
    s.life-=s.decay;if(s.life<=0)drawnSmiles.splice(i,1);
  }
  requestAnimationFrame(animateSmiles);
}
animateSmiles();

  subtitleEl.style.color='#c41e1e';

},1200);

// ═══════════════════════════════════════
//  MOUSE — INTENSIFY CHAOS
// ═══════════════════════════════════════
document.addEventListener('mousemove',(e)=>{
  const rect=glitchWrapper.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const dx=e.clientX-cx,dy=e.clientY-cy;
  const dist=Math.sqrt(dx*dx+dy*dy),maxDist=550;

  if(dist<maxDist){
    const inten=1-dist/maxDist;
    cloneBlood.style.opacity=(inten*0.5).toString();
    cloneBlood.style.transform=`translate(${-dx*inten*0.06}px,${dy*inten*0.06}px)`;
    cloneShadow.style.opacity=(inten*0.45).toString();
    cloneShadow.style.transform=`translate(${dx*inten*0.05}px,${-dy*inten*0.05}px)`;
    cloneVoid.style.opacity=(inten*0.35).toString();
    cloneAbyss.style.opacity=(inten*0.25).toString();
  }
});

});
