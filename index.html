<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sơn Tùng M-TP Playlist - Netking Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Khóa bôi đen & chọn văn bản */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* Khóa Highlight trên di động khi chạm */
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Chống cuộn trang ngoài ý muốn */
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace, sans-serif;
            color: #fff;
            /* Chống Zoom trên iOS Safari */
            touch-action: pan-x pan-y;
        }

        .outro-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        #grainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        .light-ring {
            position: absolute;
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            animation: spinRing 20s linear infinite;
            z-index: 0;
            filter: blur(40px);
        }

        .light-ring:nth-child(2) {
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
            animation-duration: 15s;
            animation-direction: reverse;
            filter: blur(50px);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        /* ===== MAIN CONTENT AREA ===== */
        .wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            width: 100%;
            max-height: 95vh;
        }

        .main-content {
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .main-text {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: clamp(2.2rem, 7vw, 5rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4);
            position: relative;
            display: inline-block;
        }

        .sub-line {
            margin-top: 5px;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0.9;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 5px;
            display: inline-block;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .char {
            display: inline-block;
            min-width: 0.7em;
            text-align: center;
            color: #fff;
        }

        /* ===== CUSTOM PLAYER PANEL ===== */
        .player-panel {
            width: 100%;
            background: rgba(10, 10, 10, 0.88);
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(12px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .now-playing {
            font-size: 0.85rem;
            color: #ffd700;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 12px #ffd700;
        }

        /* Search Bar */
        .search-box {
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        /* Custom Playlist UI */
        .custom-playlist {
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.4);
        }

        .custom-playlist::-webkit-scrollbar {
            width: 4px;
        }
        .custom-playlist::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 2px;
        }

        .playlist-item {
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s, color 0.2s;
        }

        .playlist-item:hover {
            background: rgba(255, 215, 0, 0.15);
            color: #fff;
        }

        .playlist-item.active {
            background: rgba(255, 215, 0, 0.25);
            color: #ffd700;
            font-weight: bold;
            border-left: 3px solid #ffd700;
        }

        /* Glitch Corner Text */
        .corner-text {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            opacity: 0.6;
            pointer-events: none;
        }

        .corner-text-left {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: clamp(0.6rem, 1vw, 0.8rem);
            color: #888;
            opacity: 0.5;
            pointer-events: none;
        }

        .glitch-active {
            animation: glitchEffect 0.3s steps(1) 1;
        }

        @keyframes glitchEffect {
            0% { transform: translate(0, 0); text-shadow: 2px 0 red, -2px 0 blue; }
            20% { transform: translate(-2px, 1px); text-shadow: -3px 0 cyan, 3px 0 magenta; }
            50% { transform: translate(2px, -1px); text-shadow: 3px 0 lime, -3px 0 red; }
            100% { transform: translate(0, 0); text-shadow: none; }
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0, 0, 0, 0.05) 3px, rgba(0, 0, 0, 0.05) 4px);
            pointer-events: none;
            z-index: 3;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            left: -9999px;
        }
    </style>
</head>
<body>

    <div class="outro-container">
        <div class="light-ring"></div>
        <div class="light-ring"></div>
        <div class="vignette"></div>
        <div class="scanline"></div>
        <canvas id="grainCanvas"></canvas>

        <div class="wrapper">
            <div class="main-content" title="Click để kích hoạt lại Glitch M-TP">
                <div class="main-text">
                    <span class="char">#</span>
                    <span style="display:inline-block; min-width:0.3em;">-</span>
                    <span class="char">&</span>
                    <span class="char">$</span>
                </div>
                <br>
                <div class="sub-line">⚡ NETKING ⚡</div>
            </div>

            <div class="player-panel">
                <div class="now-playing" id="trackTitle">▶ Chọn bài hát để bắt đầu</div>
                
                <div class="controls">
                    <button class="btn" id="prevBtn">◄ PREV</button>
                    <button class="btn" id="playBtn">▶ PLAY</button>
                    <button class="btn" id="nextBtn">NEXT ►</button>
                </div>

                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm kiếm bài hát...">
                </div>

                <div class="custom-playlist" id="playlistContainer"></div>
            </div>
        </div>

        <div class="corner-text" id="cornerRight">
            <span id="glitchRight">● NETKING MTP</span>
        </div>
        <div class="corner-text-left" id="cornerLeft">
            <span id="glitchLeft">#NETKING</span>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        // ==========================================
        // 1. KHÓA THAO TÁC / BẢO VỆ WEB & CHỐNG ZOOM
        // ==========================================
        
        // Vô hiệu hóa chuột phải
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Khóa phím tắt DevTools, Xem Nguồn, Lưu trang
        document.addEventListener('keydown', e => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
                (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
            ) {
                e.preventDefault();
                return false;
            }
            // Khóa Zoom bằng phím Ctrl + / Ctrl - / Ctrl 0
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
                e.preventDefault();
            }
        });

        // Khóa Zoom bằng con lăn chuột (Ctrl + Wheel)
        document.addEventListener('wheel', e => {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });

        // Khóa Zoom bằng thao tác 2 ngón tay trên di động (Pinch-to-zoom)
        document.addEventListener('touchstart', e => {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // ==========================================
        // 2. PLAYLIST & YOUTUBE PLAYER LOGIC
        // ==========================================
        const playlist = [
            { title: "Đừng Làm Trái Tim Anh Đau", id: "abPmZCZZrFA" },
            { title: "Chúng Ta Của Tương Lai", id: "0pWsCiO1-mE" },
            { title: "Making My Way", id: "N36-o42mDdc" },
            { title: "Chạy Ngay Đi (Run Now)", id: "32s188T70vU" },
            { title: "Hãy Trao Cho Anh", id: "knW7-J7ORjU" },
            { title: "Lạc Trôi", id: "Llw9Q6akRo4" },
            { title: "Có Chắc Yêu Là Đây", id: "c183BI__I_8" },
            { title: "Muộn Rồi Mà Sao Còn", id: "xypzmu5mMPY" },
            { title: "Chúng Ta Của Hiện Tại", id: "psZ1g9fMkyo" },
            { title: "Nơi Này Có Anh", id: "FN7ALfpGxiI" }
        ];

        let currentTrackIndex = 0;
        let player = null;
        let isPlaying = false;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100',
                width: '100',
                videoId: playlist[currentTrackIndex].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': () => renderPlaylist(playlist),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                nextTrack();
            }
        }

        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        const searchInput = document.getElementById('searchInput');
        const trackTitle = document.getElementById('trackTitle');

        function renderPlaylist(items) {
            playlistContainer.innerHTML = '';
            if(items.length === 0) {
                playlistContainer.innerHTML = '<div style="padding:10px; text-align:center; color:#666;">Không tìm thấy bài hát</div>';
                return;
            }

            items.forEach((track) => {
                const originalIndex = playlist.findIndex(p => p.id === track.id);
                const item = document.createElement('div');
                item.className = `playlist-item ${originalIndex === currentTrackIndex ? 'active' : ''}`;
                item.innerHTML = `<span>${originalIndex + 1}. ${track.title}</span> <span>►</span>`;
                
                item.addEventListener('click', () => {
                    playTrack(originalIndex);
                });
                
                playlistContainer.appendChild(item);
            });
        }

        function playTrack(index) {
            currentTrackIndex = index;
            if (player && player.loadVideoById) {
                player.loadVideoById(playlist[currentTrackIndex].id);
                if (isPlaying) {
                    player.playVideo();
                } else {
                    player.pauseVideo();
                }
            }
            updateUI();
        }

        function updateUI() {
            trackTitle.textContent = `🎵 ${playlist[currentTrackIndex].title}`;
            renderPlaylist(getFilteredPlaylist());
            const activeEl = playlistContainer.querySelector('.playlist-item.active');
            if(activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function getFilteredPlaylist() {
            const query = searchInput.value.toLowerCase().trim();
            return playlist.filter(item => item.title.toLowerCase().includes(query));
        }

        playBtn.addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
                playBtn.textContent = '▶ PLAY';
                isPlaying = false;
            } else {
                player.playVideo();
                playBtn.textContent = '❚❚ PAUSE';
                isPlaying = true;
            }
        });

        nextBtn.addEventListener('click', () => nextTrack());
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentTrackIndex);
        });

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(currentTrackIndex);
        }

        searchInput.addEventListener('input', () => {
            renderPlaylist(getFilteredPlaylist());
        });

        document.body.addEventListener('click', () => {
            if (player && typeof player.isMuted === 'function' && player.isMuted()) {
                player.unMute();
            }
        }, { once: true });


        // ==========================================
        // 3. ANIMATION GLITCH M-TP VÀ CANVAS
        // ==========================================
        (function() {
            const canvas = document.getElementById('grainCanvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawGrain() {
                const w = canvas.width, h = canvas.height;
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = Math.random() * 255;
                    data[i] = data[i+1] = data[i+2] = noise;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawGrain);
            }
            drawGrain();

            // Hiệu ứng nhảy chữ ngẫu nhiên ban đầu -> Chốt về "M-T-P"
            const randomChars = '!@#$%^&*()_+-=[]{}|;:,.<>?/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const charElements = document.querySelectorAll('.char'); 
            const targetChars = ['M', 'T', 'P'];
            let isAnimating = false;

            function startGlitchToMTP() {
                if (isAnimating) return;
                isAnimating = true;

                let currentCharIndex = 0;

                function processNextChar() {
                    if (currentCharIndex >= charElements.length) {
                        isAnimating = false;
                        return;
                    }

                    const el = charElements[currentCharIndex];
                    const finalChar = targetChars[currentCharIndex];
                    let step = 0;
                    const maxSteps = 10; // Số lần nháy chữ siêu tốc

                    const interval = setInterval(() => {
                        if (step >= maxSteps) {
                            clearInterval(interval);
                            el.textContent = finalChar; // Đổi về đúng chữ gốc
                            currentCharIndex++;
                            setTimeout(processNextChar, 80);
                            return;
                        }
                        // Hiển thị chữ ngẫu nhiên liên tục
                        el.textContent = randomChars[Math.floor(Math.random() * randomChars.length)];
                        step++;
                    }, 50); // Tốc độ nhảy ký tự 50ms
                }

                processNextChar();
            }

            // Chạy hiệu ứng ngay sau khi tải trang 0.8 giây
            setTimeout(startGlitchToMTP, 800);

            // Click vào chữ để phát lại hiệu ứng mã hóa
            document.querySelector('.main-content').addEventListener('click', startGlitchToMTP);

            // Glitch text góc màn hình
            const phrasesRight = ['● NETKING MTP', '✦ SON TUNG M-TP', '★ NETKING', '◆ SKY CƠN MƯA'];
            const elRight = document.getElementById('glitchRight');
            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % phrasesRight.length;
                elRight.textContent = phrasesRight[idx];
                elRight.classList.add('glitch-active');
                setTimeout(() => elRight.classList.remove('glitch-active'), 300);
            }, 2200);
        })();
    </script>
</body>
</html>
