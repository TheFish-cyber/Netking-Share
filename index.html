<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Universe</title>
<style>
:root{--bg:#050510;--panel-bg:rgba(10,10,25,0.88);--border:rgba(255,255,255,0.08)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;width:100vw;cursor:crosshair;user-select:none;-webkit-user-select:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#top{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:center;pointer-events:none}
#tname{font-size:18px;font-weight:700;letter-spacing:2px;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.5);background:var(--panel-bg);padding:7px 18px;border-radius:28px;border:1px solid var(--border);pointer-events:auto;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#stats{font-size:10px;letter-spacing:1.5px;color:#999;background:var(--panel-bg);padding:5px 12px;border-radius:20px;border:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#mode{position:fixed;top:16px;right:16px;z-index:10;font-size:10px;letter-spacing:2px;color:#999;background:var(--panel-bg);padding:6px 14px;border-radius:20px;border:1px solid var(--border);cursor:pointer;text-transform:uppercase;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#mode:hover{color:#fff;border-color:rgba(255,255,255,0.25)}
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;text-align:center;transition:opacity 1s}
#hint span{font-size:12px;color:rgba(255,255,255,0.22);letter-spacing:5px}
#panel{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:5px;padding:8px 12px;background:var(--panel-bg);border:1px solid var(--border);border-radius:36px;flex-wrap:wrap;justify-content:center;max-width:95vw;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:rgba(255,255,255,0.04);color:#bbb;font-size:14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;outline:none;flex-shrink:0}
.dot:hover{background:rgba(255,255,255,0.12);transform:translateY(-3px);border-color:rgba(255,255,255,0.35)}
.dot.active{border-color:#fff;background:rgba(255,255,255,0.18);box-shadow:0 0 24px rgba(255,255,255,0.25);animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 24px rgba(255,255,255,0.25)}50%{box-shadow:0 0 44px rgba(255,255,255,0.5)}}
.dot .tt{position:absolute;bottom:44px;left:50%;transform:translateX(-50%) translateY(5px);background:rgba(0,0,0,0.9);color:#fff;padding:3px 10px;border-radius:12px;font-size:10px;white-space:nowrap;pointer-events:none;opacity:0;transition:all 0.2s}
.dot:hover .tt{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:768px){.dot{width:28px;height:28px;font-size:12px}.dot .tt{display:none}#tname{font-size:14px;padding:5px 10px}#panel{gap:3px;padding:5px 8px;bottom:8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><span id="tname">✨ IDLE</span><span id="stats"></span></div>
<div id="mode">🌙 SLEEP</div>
<div id="hint"><span>MOVE OR CLICK TO AWAKEN</span></div>
<div id="panel"></div>

<script>
// ╔══════════════════════════════════════════════════════════════════════════╗
// ║                    PARTICLE UNIVERSE — CLEAN ENGINE                    ║
// ╚══════════════════════════════════════════════════════════════════════════╝

// ─── CANVAS ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; cx = W / 2; cy = H / 2; }
window.addEventListener('resize', resize); resize();

// ─── MOUSE ──────────────────────────────────────────────────────────────────
const mouse = { x: cx, y: cy, vx: 0, vy: 0, down: false, active: false, trail: [], idleTime: 0 };
window.addEventListener('mousemove', e => {
  mouse.vx = e.clientX - mouse.x; mouse.vy = e.clientY - mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.active = true; mouse.idleTime = 0;
  mouse.trail.push({ x: mouse.x, y: mouse.y, life: 1 });
  if (mouse.trail.length > 20) mouse.trail.shift();
});
window.addEventListener('mousedown', () => { mouse.down = true; mouse.idleTime = 0; });
window.addEventListener('mouseup', () => { mouse.down = false; });
window.addEventListener('touchmove', e => {
  if (e.touches[0]) { const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true; mouse.idleTime = 0; }
}, { passive: true });

// ─── UTILS ──────────────────────────────────────────────────────────────────
function rand(a, b) { return Math.random() * (b - a) + a; }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hexToRgb(h) { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join(''); }
function lerpColor(c1, c2, t) { const a = hexToRgb(c1), b = hexToRgb(c2); return rgbToHex(Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))); }

// ─── PALETTES ───────────────────────────────────────────────────────────────
const PAL = {
  star: ['#fff3b0', '#ffe066', '#ffd700', '#fbbf24', '#f59e0b', '#d97706'],
  lotus: ['#fce7f3', '#f9a8d4', '#f472b6', '#ec4899', '#db2777', '#be185d'],
  dragon: ['#dcfce7', '#86efac', '#4ade80', '#22c55e', '#16a34a', '#15803d'],
  galaxy: ['#e0e7ff', '#a5b4fc', '#818cf8', '#6366f1', '#4f46e5', '#38bdf8'],
  butterfly: ['#ffedd5', '#fdba74', '#fb923c', '#f97316', '#ea580c', '#f472b6'],
  skull: ['#dcfce7', '#86efac', '#4ade80', '#22c55e', '#16a34a', '#a3e635'],
  phoenix: ['#fee2e2', '#fca5a5', '#ef4444', '#dc2626', '#f97316', '#fbbf24'],
  heart: ['#ffe4e6', '#fda4af', '#f43f5e', '#e11d48', '#f472b6', '#ec4899'],
  ocean: ['#cffafe', '#67e8f9', '#22d3ee', '#06b6d4', '#0891b2', '#0e7490'],
  forest: ['#dcfce7', '#86efac', '#4ade80', '#22c55e', '#15803d', '#78350f'],
  neon: ['#fae8ff', '#e879f9', '#d946ef', '#c026d3', '#22d3ee', '#fbbf24'],
  ice: ['#f0f9ff', '#bae6fd', '#7dd3fc', '#38bdf8', '#0ea5e9', '#0284c7'],
  sunset: ['#ffedd5', '#fdba74', '#f97316', '#c2410c', '#a855f7', '#7c3aed'],
  void: ['#f3e8ff', '#d8b4fe', '#a855f7', '#7e22ce', '#581c87', '#3b0764'],
  rainbow: ['#ef4444', '#f97316', '#fbbf24', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6'],
  chaos: ['#ff0000', '#ff8800', '#ffff00', '#00ff00', '#00ffff', '#ff00ff', '#ff0088', '#8800ff'],
};

// ─── SHAPE GENERATORS ───────────────────────────────────────────────────────
function shapeStar(cx, cy, s, n) { n = n || 250; const o = [], R = s, r = s * 0.38; for (let i = 0; i < n; i++) { const t = i / n * 10, idx = Math.floor(t), f = t - idx, ni = (idx + 1) % 10; const a1 = idx * Math.PI / 5 - Math.PI / 2, a2 = ni * Math.PI / 5 - Math.PI / 2; const r1 = idx % 2 === 0 ? R : r, r2 = ni % 2 === 0 ? R : r; o.push({ x: cx + Math.cos(a1 + (a2 - a1) * f) * (r1 + (r2 - r1) * f), y: cy + Math.sin(a1 + (a2 - a1) * f) * (r1 + (r2 - r1) * f) }); } for (let i = 0; i < n * 0.4; i++) { const a = rand(0, Math.PI * 2), mr = s * Math.sqrt(rand(0, 1)); o.push({ x: cx + Math.cos(a) * mr, y: cy + Math.sin(a) * mr }); } return o; }

function shapeHeart(cx, cy, s, n) { n = n || 250; const o = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2, x = 16 * Math.pow(Math.sin(t), 3), y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)), sc = s / 17; o.push({ x: cx + x * sc, y: cy + y * sc }); } for (let i = 0; i < n * 0.4; i++) { const t = rand(0, Math.PI * 2), rr = Math.sqrt(rand(0, 1)) * 0.8, x = 16 * Math.pow(Math.sin(t), 3) * rr, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * rr; o.push({ x: cx + x * s / 17, y: cy + y * s / 17 }); } return o; }

function shapeSpiral(cx, cy, s, n) { n = n || 300; const o = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 6, r = t * s * 0.16; o.push({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r }); } return o; }

function shapeRing(cx, cy, s, n) { n = n || 300; const o = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; o.push({ x: cx + Math.cos(a) * s, y: cy + Math.sin(a) * s }); } return o; }

function shapeDiamond(cx, cy, s, n) { n = n || 250; const o = []; const hw = s, hh = s * 0.7; for (let i = 0; i < n;) { const px = rand(-hw, hw), py = rand(-hh, hh); if (Math.abs(px) / hw + Math.abs(py) / hh <= 1) { o.push({ x: cx + px, y: cy + py }); i++; } } return o; }

function shapeCross(cx, cy, s, n) { n = n || 250; const o = []; const w = s * 0.15, l = s; for (let i = 0; i < n; i++) { if (Math.random() < 0.5) o.push({ x: cx + rand(-l, l), y: cy + rand(-w, w) }); else o.push({ x: cx + rand(-w, w), y: cy + rand(-l, l) }); } return o; }

function shapeInfinity(cx, cy, s, n) { n = n || 300; const o = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2, c2 = Math.cos(2 * t), r = s * Math.sqrt(Math.max(0, c2)), j = s * 0.04; o.push({ x: cx + Math.cos(t) * r + rand(-j, j), y: cy + Math.sin(t) * r * 0.7 + rand(-j, j) }); } return o; }

function shapeHexagon(cx, cy, s, n) { n = n || 250; const o = []; for (let i = 0; i < n * 0.3; i++) { const t = i / (n * 0.3) * 6, idx = Math.floor(t), f = t - idx, ni = (idx + 1) % 6; const a1 = idx / 6 * Math.PI * 2, a2 = ni / 6 * Math.PI * 2; o.push({ x: cx + Math.cos(a1 + (a2 - a1) * f) * s, y: cy + Math.sin(a1 + (a2 - a1) * f) * s }); } for (let i = 0; i < n * 0.5; i++) { const a = rand(0, Math.PI * 2), r = rand(0, s); o.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }); } return o; }

function shapeTriangle(cx, cy, s, n) { n = n || 250; const o = []; const verts = []; for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2 - Math.PI / 2; verts.push({ x: cx + Math.cos(a) * s, y: cy + Math.sin(a) * s }); } for (let i = 0; i < n * 0.3; i++) { const t = i / (n * 0.3) * 3, idx = Math.floor(t), f = t - idx, ni = (idx + 1) % 3; o.push({ x: lerp(verts[idx].x, verts[ni].x, f), y: lerp(verts[idx].y, verts[ni].y, f) }); } for (let i = 0; i < n * 0.5; i++) { const a = rand(0, Math.PI * 2), r = rand(0, s); o.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.85 }); } return o; }

function shapeSkull(cx, cy, s, n) { n = n || 350; const o = []; const sz = s; for (let i = 0; i < 100; i++) { const a = Math.PI + i / 100 * Math.PI; o.push({ x: cx + Math.cos(a) * sz * 0.65, y: cy - sz * 0.45 + Math.sin(a) * sz * 0.6 }); } for (let i = 0; i < 50; i++) { const t = i / 50; for (let side = -1; side <= 1; side += 2) o.push({ x: cx + side * (sz * 0.65 - t * sz * 0.35), y: cy + sz * 0.05 + t * sz * 0.4 + rand(-2, 2) }); } for (let i = 0; i < 30; i++) { const t = i / 30; for (let side = -1; side <= 1; side += 2) o.push({ x: cx + side * sz * 0.28 * (1 - t), y: cy + sz * 0.45 + t * sz * 0.08 }); } for (let eye = -1; eye <= 1; eye += 2) { for (let i = 0; i < 25; i++) { const a = i / 25 * Math.PI * 2; o.push({ x: cx + eye * sz * 0.2 + Math.cos(a) * sz * 0.12, y: cy - sz * 0.06 + Math.sin(a) * sz * 0.13 }); } } for (let i = 0; i < 25; i++) { const t = i / 25, x = -sz * 0.22 + t * sz * 0.44; o.push({ x: cx + x, y: cy + sz * 0.25 + (i % 2) * (i % 3 === 0 ? sz * 0.06 : sz * 0.04) }); } return o; }

function shapePhoenix(cx, cy, s, n) { n = n || 350; const o = []; for (let i = 0; i < 60; i++) { const t = i / 60; o.push({ x: cx + Math.sin(t * Math.PI * 1.5) * s * 0.12, y: cy - t * s + s * 0.3 + rand(-3, 3) }); } for (let i = 0; i < 25; i++) { const a = i / 25 * Math.PI * 2; o.push({ x: cx + Math.cos(a) * s * 0.1, y: cy - s * 0.7 + Math.sin(a) * s * 0.08 }); } for (let wing = -1; wing <= 1; wing += 2) { for (let i = 0; i < 90; i++) { const t = i / 90, fa = Math.sin(t * Math.PI); const wx = wing * (t * s * 1.3 + fa * s * 0.5 * (1 - t * 0.3)); const wy = -s * 0.3 + t * s * 0.45 - fa * s * 0.2 * (1 - t); if (Math.random() < 0.55) { const ff = Math.sqrt(Math.random()); o.push({ x: cx + wx * ff, y: cy + wy * ff }); } else o.push({ x: cx + wx, y: cy + wy + rand(-3, 3) }); } } for (let i = 0; i < 40; i++) { const a = rand(0, Math.PI * 2), r = s * (0.3 + rand(0, 0.6)); o.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.5 }); } return o; }

function shapeCrown(cx, cy, s, n) { n = n || 250; const o = []; const cw = s, cH = s * 0.65, pts = 5; for (let i = 0; i < n * 0.2; i++) { const t = i / (n * 0.2); o.push({ x: cx - cw + t * cw * 2, y: cy + cH * 0.45 + rand(-s * 0.04, s * 0.04) }); } for (let p = 0; p < pts; p++) { const px = cx - cw + p / (pts - 1) * cw * 2; for (let i = 0; i < n * 0.08; i++) { const t = i / (n * 0.08); o.push({ x: px + rand(-s * 0.03, s * 0.03), y: cy - cH * 0.5 * t + rand(-2, 2) }); } } for (let i = 0; i < n * 0.4; i++) o.push({ x: cx + rand(-cw, cw), y: cy + rand(-cH * 0.5, cH * 0.5) }); return o; }

function shapeWave(cx, cy, s, n) { n = n || 300; const o = []; for (let i = 0; i < n; i++) { const t = (i / n - 0.5) * 2, x = t * s * 2, y1 = Math.sin(t * Math.PI * 5) * s * 0.5, y2 = Math.sin(t * Math.PI * 5 + Math.PI) * s * 0.25; const sp = s * 0.1; o.push({ x: cx + x + rand(-sp, sp), y: cy + y1 + rand(-sp, sp) }); o.push({ x: cx + x + rand(-sp, sp), y: cy + y2 + rand(-sp, sp) }); } return o; }

function shapeEye(cx, cy, s, n) { n = n || 300; const o = []; for (let i = 0; i < n * 0.3; i++) { const a = i / (n * 0.3) * Math.PI * 2; o.push({ x: cx + Math.cos(a) * s * 0.7, y: cy + Math.sin(a) * s * 0.35 }); } for (let i = 0; i < n * 0.2; i++) { const a = i / (n * 0.2) * Math.PI * 2; o.push({ x: cx + Math.cos(a) * s * 0.22, y: cy + Math.sin(a) * s * 0.22 }); } for (let i = 0; i < n * 0.1; i++) { const a = i / (n * 0.1) * Math.PI * 2; o.push({ x: cx + Math.cos(a) * s * 0.07, y: cy + Math.sin(a) * s * 0.07 }); } return o; }

// ─── PARTICLE CLASS ─────────────────────────────────────────────────────────
class Particle {
  constructor(x, y) {
    this.x = x !== undefined ? x : rand(0, W);
    this.y = y !== undefined ? y : rand(0, H);
    this.tx = this.x; this.ty = this.y;
    this.vx = rand(-1, 1); this.vy = rand(-1, 1);
    this.size = rand(0.5, 2.8); this.baseSize = this.size;
    this.color = '#fff'; this.alpha = rand(0.5, 0.9);
    this.glow = rand(0.2, 1.5);
    this.life = 1; this.decay = rand(0.001, 0.004); this.alive = true;
    this.phase = rand(0, Math.PI * 2); this.freq = rand(0.01, 0.06);
    this.trail = []; this.maxTrail = randInt(2, 6);
    this.orbitA = rand(0, Math.PI * 2); this.orbitR = rand(0.2, 2.5); this.orbitS = rand(-0.02, 0.02);
    this.wander = rand(0.2, 1.2); this.spring = rand(0.8, 1.2);
    this.isHero = Math.random() < 0.05;
    if (this.isHero) { this.size *= 2.2; this.baseSize *= 2.2; this.glow *= 3; }
  }
  setTarget(tx, ty) { this.tx = tx; this.ty = ty; }
  update(speed, chaos, mf, time, dt) {
    const dts = dt * 60;
    if (Math.random() < 0.3) { this.trail.push({ x: this.x, y: this.y, a: this.alpha * this.life }); if (this.trail.length > this.maxTrail) this.trail.shift(); }
    for (let i = this.trail.length - 1; i >= 0; i--) { this.trail[i].a -= 0.05 * dts; if (this.trail[i].a <= 0) this.trail.splice(i, 1); }
    const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy);
    const sf = 0.015 * speed * this.spring * (1 + Math.min(d / 250, 1.5));
    this.vx += dx * sf; this.vy += dy * sf;
    this.vx += Math.sin(time * this.freq * 5 + this.phase) * chaos * this.wander * 0.35;
    this.vy += Math.cos(time * this.freq * 5 + this.phase + 1.5) * chaos * this.wander * 0.35;
    this.orbitA += this.orbitS * dts;
    this.vx += Math.cos(this.orbitA) * this.orbitR * 0.05;
    this.vy += Math.sin(this.orbitA) * this.orbitR * 0.05;
    if (mouse.active) {
      const mdx = mouse.x - this.x, mdy = mouse.y - this.y, md = Math.hypot(mdx, mdy);
      if (mouse.down && md < 150) { const f = (1 - md / 150) * mf; this.vx += (mdx / (md + 0.1)) * f * 2; this.vy += (mdy / (md + 0.1)) * f * 2; }
      else if (!mouse.down && md < 180) { const f = (1 - md / 180) * mf; this.vx -= (mdx / (md + 0.1)) * f; this.vy -= (mdy / (md + 0.1)) * f; }
    }
    this.vx *= 0.91; this.vy *= 0.91;
    const ms = 8 * speed; const spd = Math.hypot(this.vx, this.vy); if (spd > ms) { const s = ms / spd; this.vx *= s; this.vy *= s; }
    this.x += this.vx * dts; this.y += this.vy * dts;
    this.life -= this.decay * dts; if (this.life < 0) { this.life = 0; this.alive = false; }
  }
  respawn() {
    this.x = rand(0, W); this.y = rand(0, H); this.tx = this.x; this.ty = this.y;
    this.vx = rand(-1, 1); this.vy = rand(-1, 1);
    this.life = 0.8 + rand(0, 0.2); this.alive = true;
    this.trail = []; this.phase = rand(0, Math.PI * 2);
  }
  draw(ctx, time, glowI) {
    if (this.life < 0.005) return;
    const a = this.alpha * this.life;
    const sz = this.size * (0.8 + 0.2 * Math.sin(time * 3 + this.phase));
    if (this.trail.length >= 2) {
      ctx.beginPath(); ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
      ctx.lineTo(this.x, this.y);
      ctx.strokeStyle = this.color.replace('rgb', 'rgba').replace(')', ',' + (a * 0.3) + ')');
      ctx.lineWidth = sz * 0.4; ctx.lineCap = 'round'; ctx.stroke();
    }
    if (this.glow > 0.1 && glowI > 0.05) {
      const gs = sz * 3 * this.glow * glowI;
      const g = ctx.createRadialGradient(this.x, this.y, sz * 0.15, this.x, this.y, gs);
      g.addColorStop(0, this.color.replace('rgb', 'rgba').replace(')', ',' + (a * 0.45) + ')'));
      g.addColorStop(0.5, this.color.replace('rgb', 'rgba').replace(')', ',' + (a * 0.12) + ')'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(this.x, this.y, gs, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(this.x, this.y, sz, 0, Math.PI * 2);
    ctx.fillStyle = this.color.replace('rgb', 'rgba').replace(')', ',' + a + ')'); ctx.fill();
    if (sz > 0.6) { ctx.beginPath(); ctx.arc(this.x, this.y, sz * 0.3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.6) + ')'; ctx.fill(); }
  }
}

// ─── BACKGROUND STARS ───────────────────────────────────────────────────────
class BgStar {
  constructor() { this.x = rand(0, W); this.y = rand(0, H); this.s = rand(0.3, 2); this.a = rand(0.2, 0.8); this.sp = rand(0.5, 3); this.ph = rand(0, Math.PI * 2); }
  draw(ctx, t) { const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * this.sp + this.ph)); ctx.beginPath(); ctx.arc(this.x, this.y, this.s * tw, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,' + (this.a * tw) + ')'; ctx.fill(); }
}
let bgStars = [];
function initBg() { bgStars = []; for (let i = 0; i < 200; i++) bgStars.push(new BgStar()); }
initBg();

// ─── SPARKS ─────────────────────────────────────────────────────────────────
class Spark {
  constructor(x, y, c) { this.x = x; this.y = y; this.vx = rand(-3, 3); this.vy = rand(-3, 1); this.l = 1; this.d = rand(0.03, 0.08); this.s = rand(0.3, 1.5); this.c = c || '#fff'; }
  update(dt) { this.vx *= 0.94; this.vy *= 0.94; this.x += this.vx * dt * 60; this.y += this.vy * dt * 60; this.l -= this.d * dt * 60; }
  draw(ctx) { if (this.l <= 0) return; ctx.beginPath(); ctx.arc(this.x, this.y, this.s * this.l, 0, Math.PI * 2); ctx.fillStyle = this.c.replace('rgb', 'rgba').replace(')', ',' + this.l + ')'); ctx.fill(); }
}
let sparkPool = [];
function emitSparks(x, y, pal, n) { n = Math.min(n, 200 - sparkPool.length); for (let i = 0; i < n; i++) sparkPool.push(new Spark(x, y, pal[randInt(0, pal.length - 1)])); }
function updateSparks(dt) { for (let i = sparkPool.length - 1; i >= 0; i--) { sparkPool[i].update(dt); if (sparkPool[i].l <= 0) sparkPool.splice(i, 1); } }
function drawSparks(ctx) { for (const s of sparkPool) s.draw(ctx); }

// ─── PARTICLE SYSTEM ────────────────────────────────────────────────────────
class ParticleSystem {
  constructor() {
    this.particles = [];
    this.current = 0; this.target = 0; this.tProgress = 1;
    this.time = 0;
    this.auto = true; this.cycleT = 0; this.cycleI = 10;
    this.fps = 60; this.fpsT = 0; this.fpsF = 0;
    this.budget = 1000;
    this.gSpeed = 1; this.gChaos = 1; this.gGlow = 0.7;
    this.idle = false;  // Start active, not idle
    this.init();
  }
  init() {
    const th = THEMES[this.current];
    const n = Math.min(th.count, this.budget);
    this.particles = [];
    for (let i = 0; i < n; i++) { const p = new Particle(rand(0, W), rand(0, H)); p.color = th.pal[i % th.pal.length]; this.particles.push(p); }
  }
  go(idx) {
    if (idx === this.target && this.tProgress >= 1) return;
    emitSparks(cx, cy, THEMES[this.current].pal, 50);
    this.target = idx; this.tProgress = 0;
    const n = Math.min(THEMES[idx].count, this.budget);
    while (this.particles.length < n) { const p = new Particle(rand(0, W), rand(0, H)); p.color = THEMES[idx].pal[this.particles.length % THEMES[idx].pal.length]; this.particles.push(p); }
    for (let i = n; i < this.particles.length; i++) this.particles[i].decay = 0.02;
  }
  wake() { this.idle = false; this.auto = true; this.cycleT = 0; }
  sleep() { this.idle = true; this.auto = false; }
  update(dt) {
    if (dt > 0.1) dt = 0.1; if (dt <= 0) dt = 0.016;
    this.time += dt;
    this.fpsF++; this.fpsT += dt; if (this.fpsT >= 1) { this.fps = this.fpsF; this.fpsF = 0; this.fpsT = 0; }
    if (this.auto && !this.idle) { this.cycleT += dt; if (this.cycleT >= this.cycleI) { this.cycleT = 0; this.go((this.target + 1) % THEMES.length); } }
    if (this.tProgress < 1) { this.tProgress = Math.min(1, this.tProgress + dt * 0.85); if (this.tProgress >= 1) { this.current = this.target; const n = Math.min(THEMES[this.current].count, this.budget); while (this.particles.length > n) this.particles.pop(); } }
    const th = THEMES[this.current], tth = THEMES[this.target];
    const n = this.particles.length, tp = this.tProgress, ease = tp < 0.5 ? 2 * tp * tp : 1 - Math.pow(-2 * tp + 2, 2) / 2;
    let sp, ch, mf;
    if (tp < 1) { sp = lerp(th.speed, tth.speed, ease) * this.gSpeed; ch = lerp(th.chaos, tth.chaos, ease) * this.gChaos; mf = lerp(th.mf, tth.mf, ease); }
    else { sp = th.speed * this.gSpeed; ch = th.chaos * this.gChaos; mf = th.mf; }
    if (this.idle) { sp *= 0.6; ch *= 0.5; mf *= 0.3; }
    for (let i = 0; i < n; i++) {
      const p = this.particles[i]; let tgt;
      if (tp < 1) { const ft = th.get(p, i, n, this.time), tt = tth.get(p, i, n, this.time); tgt = { x: lerp(ft.x, tt.x, ease), y: lerp(ft.y, tt.y, ease) }; }
      else tgt = th.get(p, i, n, this.time);
      p.setTarget(tgt.x, tgt.y);
      if (tp < 1) p.color = lerpColor(th.pal[i % th.pal.length], tth.pal[i % tth.pal.length], ease);
      else p.color = th.pal[i % th.pal.length];
      p.update(sp, ch, mf, this.time, dt);
      if (!p.alive && p.life <= 0) { p.respawn(); const pal = tp < 1 ? tth.pal : th.pal; p.color = pal[i % pal.length]; }
    }
    updateSparks(dt);
    for (let j = mouse.trail.length - 1; j >= 0; j--) { mouse.trail[j].life -= dt * 2; if (mouse.trail[j].life <= 0) mouse.trail.splice(j, 1); }
    if (this.idle) { mouse.trail.length = 0; sparkPool.length = 0; }
  }
  draw(ctx) {
    ctx.clearRect(0, 0, W, H);
    // Always show particles beautifully
    for (const s of bgStars) s.draw(ctx, this.time);
    const at = this.tProgress < 1 ? THEMES[this.target] : THEMES[this.current];
    if (!this.idle) at.bg(ctx, this.time);
    drawSparks(ctx);
    const glowM = this.idle ? this.gGlow * 0.6 : this.gGlow;
    for (const p of this.particles) p.draw(ctx, this.time, glowM);
    if (!this.idle && mouse.active && mouse.trail.length > 2) {
      ctx.beginPath(); ctx.moveTo(mouse.trail[0].x, mouse.trail[0].y);
      for (let i = 1; i < mouse.trail.length; i++) ctx.lineTo(mouse.trail[i].x, mouse.trail[i].y);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();
    }
    const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.5, cx, cy, Math.max(W, H) * 0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + (this.idle ? 0.6 : 0.5) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

// ─── BOOTSTRAP ──────────────────────────────────────────────────────────────
const sys = new ParticleSystem();
// Start active - show all themes immediately
sys.current = 0; sys.target = 0; sys.tProgress = 1;

// UI refs
const tnEl = document.getElementById('tname');
const stEl = document.getElementById('stats');
const mdEl = document.getElementById('mode');
const hiEl = document.getElementById('hint');
const pnEl = document.getElementById('panel');

// Build buttons
function buildBtns() {
  pnEl.innerHTML = '';
  for (let i = 0; i < THEMES.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'dot'; btn.setAttribute('data-theme', i);
    btn.innerHTML = THEMES[i].icon + '<span class="tt">' + THEMES[i].name + '</span>';
    btn.addEventListener('click', (idx => () => { sys.go(idx); sys.wake(); updateUI(); })(i));
    pnEl.appendChild(btn);
  }
}
buildBtns();

function updateUI() {
  const th = sys.tProgress < 1 ? THEMES[sys.target] : THEMES[sys.current];
  tnEl.textContent = sys.idle ? '✨ IDLE' : (th.icon + ' ' + th.name);
  stEl.textContent = sys.particles.length + ' ⬤ | ' + sys.fps + ' FPS';
  mdEl.textContent = sys.idle ? '🌙 SLEEP' : (sys.auto ? '🔄 AUTO' : '🎯 MANUAL');
  const btns = pnEl.querySelectorAll('.dot');
  for (let i = 0; i < btns.length; i++) btns[i].classList.toggle('active', parseInt(btns[i].dataset.theme) === sys.target);
  hiEl.style.opacity = sys.idle ? '1' : '0';
}

// Wake on interaction
function onInteract() {
  if (sys.idle) { sys.wake(); mouse.idleTime = 0; }
  mouse.idleTime = 0;
}
['mousedown', 'click', 'wheel', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, onInteract));
window.addEventListener('mousemove', e => { if (Math.abs(mouse.vx) > 2 || Math.abs(mouse.vy) > 2) { if (sys.idle) { sys.wake(); } mouse.idleTime = 0; } });

// Auto-sleep after 8s of no mouse movement
setInterval(() => {
  if (mouse.active) mouse.idleTime += 0.5;
  if (!sys.idle && mouse.idleTime > 8 && !mouse.down) { sys.sleep(); updateUI(); }
}, 500);

// Keyboard
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'a') { sys.auto = !sys.auto; sys.cycleT = 0; if (!sys.idle) updateUI(); }
  if (k === 'arrowleft') { e.preventDefault(); sys.go((sys.target - 1 + THEMES.length) % THEMES.length); sys.wake(); updateUI(); }
  if (k === 'arrowright') { e.preventDefault(); sys.go((sys.target + 1) % THEMES.length); sys.wake(); updateUI(); }
  if (k === ' ') { e.preventDefault(); sys.go(Math.floor(Math.random() * THEMES.length)); sys.wake(); updateUI(); }
  if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.body.requestFullscreen().catch(() => {}); }
  const nums = '1234567890qwertyuiop';
  const idx = nums.indexOf(k);
  if (idx >= 0 && idx < THEMES.length) { sys.go(idx); sys.wake(); updateUI(); }
});

// Scroll
let sa = 0;
window.addEventListener('wheel', e => { sa += e.deltaY; if (Math.abs(sa) > 60) { sys.go((sys.target + (sa > 0 ? 1 : -1) + THEMES.length) % THEMES.length); sys.wake(); updateUI(); sa = 0; } }, { passive: true });

// Mode badge
mdEl.addEventListener('click', () => { if (sys.idle) { sys.wake(); } else { sys.auto = !sys.auto; sys.cycleT = 0; } updateUI(); });

// Resize
window.addEventListener('resize', () => { resize(); initBg(); for (const t of THEMES) t._c = null; });

// Main loop
let lft = performance.now();
function loop(ts) {
  let dt = (ts - lft) / 1000; lft = ts; if (dt > 0.1) dt = 0.1; if (dt <= 0) dt = 0.016;
  sys.update(dt); sys.draw(ctx); updateUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ─── NEW SHAPE GENERATORS (each clearly forms its icon) ─────────────────────

// Dove / Peace bird
function shapeDove(cx,cy,s,n){n=n||300;const o=[];for(let i=0;i<n*0.35;i++){const t=i/(n*0.35),a=t*Math.PI;const x=cx+Math.cos(a)*s*0.5;const y=cy-s*0.2+Math.sin(a)*s*0.3;o.push({x:x+rand(-5,5),y:y+rand(-3,3)})}for(let i=0;i<n*0.2;i++){const t=i/(n*0.2);o.push({x:cx+t*s*0.4-s*0.2,y:cy-s*0.1+rand(-3,3)})}for(let w=-1;w<=1;w+=2){for(let i=0;i<n*0.15;i++){const t=i/(n*0.15);o.push({x:cx+w*(Math.sin(t*Math.PI)*s*0.3),y:cy-s*0.1+t*s*0.15})}}return o}

// Castle / Tower
function shapeCastle(cx,cy,s,n){n=n||300;const o=[];const bw=s*0.7,bh=s*0.6;for(let i=0;i<n*0.3;i++){o.push({x:cx+rand(-bw,bw),y:cy+rand(-bh,bh)})}const towers=3;for(let t=0;t<towers;t++){const tx=cx-bw+(t/(towers-1))*bw*2;for(let i=0;i<n*0.1;i++){const j=i/(n*0.1);o.push({x:tx+rand(-s*0.08,s*0.08),y:cy-bh*j+rand(-2,2)})}}for(let t=0;t<towers;t++){const tx=cx-bw+(t/(towers-1))*bw*2;for(let i=0;i<n*0.04;i++){const a=i/(n*0.04)*Math.PI;o.push({x:tx+Math.cos(a)*s*0.08,y:cy-bh-Math.sin(a)*s*0.05})}}return o}

// Umbrella
function shapeUmbrella(cx,cy,s,n){n=n||250;const o=[];for(let i=0;i<n*0.3;i++){const a=Math.PI+i/(n*0.3)*Math.PI;o.push({x:cx+Math.cos(a)*s*0.55,y:cy-s*0.2+Math.sin(a)*s*0.4})}for(let i=0;i<n*0.15;i++){o.push({x:cx+rand(-2,2),y:cy-s*0.2+rand(-s*0.5,s*0.5)})}for(let i=0;i<n*0.1;i++){const a=Math.PI*0.7+i/(n*0.1)*Math.PI*0.6;o.push({x:cx+Math.cos(a)*s*0.3,y:cy+Math.sin(a)*s*0.3})}return o}

// Camera
function shapeCamera(cx,cy,s,n){n=n||250;const o=[];const rw=s*0.5,rh=s*0.35;for(let i=0;i<n*0.3;i++){o.push({x:cx+rand(-rw,rw),y:cy+rand(-rh,rh)})}for(let i=0;i<n*0.2;i++){const a=i/(n*0.2)*Math.PI*2;o.push({x:cx+Math.cos(a)*s*0.2,y:cy+Math.sin(a)*s*0.2})}for(let i=0;i<n*0.1;i++){o.push({x:cx+rand(-s*0.15,s*0.15),y:cy-rh+rand(-s*0.08,s*0.08)})}return o}

// Phone
function shapePhone(cx,cy,s,n){n=n||250;const o=[];const rw=s*0.2,rh=s*0.5;for(let i=0;i<n*0.4;i++){o.push({x:cx+rand(-rw,rw),y:cy+rand(-rh,rh)})}for(let i=0;i<n*0.15;i++){const a=i/(n*0.15)*Math.PI*2;o.push({x:cx+Math.cos(a)*s*0.08,y:cy+Math.sin(a)*s*0.08})}return o}

// Book
function shapeBook(cx,cy,s,n){n=n||250;const o=[];for(let i=0;i<n*0.35;i++){o.push({x:cx+rand(-s*0.35,s*0.35),y:cy+rand(-s*0.45,s*0.45)})}for(let i=0;i<n*0.15;i++){o.push({x:cx+rand(-2,2),y:cy+rand(-s*0.4,s*0.4)})}return o}

// Candle
function shapeCandle(cx,cy,s,n){n=n||250;const o=[];for(let i=0;i<n*0.3;i++){o.push({x:cx+rand(-s*0.1,s*0.1),y:cy+rand(-s*0.4,s*0.4)})}for(let i=0;i<n*0.3;i++){const t=i/(n*0.3),y=cy-s*0.4+t*s*0.15;const w=s*0.12*(1-t);o.push({x:cx+rand(-w,w),y:y+rand(-2,2)})}return o}

// Volcano
function shapeVolcano(cx,cy,s,n){n=n||300;const o=[];for(let i=0;i<n*0.35;i++){const t=i/(n*0.35);const y=cy-s*0.3+t*s*0.7;const w=s*0.35*(1-t)+s*0.1;o.push({x:cx+rand(-w,w),y:y})}for(let i=0;i<n*0.25;i++){const t=i/(n*0.25);o.push({x:cx+rand(-s*0.08,s*0.08),y:cy-s*0.3-t*s*0.2})}return o}

// Tornado
function shapeTornado(cx,cy,s,n){n=n||300;const o=[];for(let i=0;i<n;i++){const t=i/n;const y=cy-s*0.6+t*s*1.2;const r=s*0.15*(1-t)*Math.sin(t*20+rand(0,0.5))*1.5;o.push({x:cx+Math.cos(t*15)*r,y:y+rand(-3,3)})}return o}

// Bridge
function shapeBridge(cx,cy,s,n){n=n||250;const o=[];for(let i=0;i<n*0.5;i++){const t=i/(n*0.5);const a=Math.PI+t*Math.PI;o.push({x:cx+Math.cos(a)*s*0.5,y:cy+Math.sin(a)*s*0.3})}for(let i=0;i<n*0.2;i++){const t=i/(n*0.2);o.push({x:cx-s*0.5+t*s,y:cy+s*0.3+rand(-2,2)})}return o}

// Magnet
function shapeMagnet(cx,cy,s,n){n=n||250;const o=[];const hw=s*0.12,hh=s*0.3;for(let i=0;i<n*0.4;i++){o.push({x:cx+rand(-hw,hw),y:cy+rand(-hh,hh)})}for(let i=0;i<n*0.2;i++){o.push({x:cx+rand(-s*0.3,s*0.3),y:cy-hh+rand(-s*0.06,s*0.06)})}for(let i=0;i<n*0.15;i++){o.push({x:cx+rand(-s*0.3,s*0.3),y:cy+hh+rand(-s*0.06,s*0.06)})}return o}

// Hourglass
function shapeHourglass(cx,cy,s,n){n=n||300;const o=[];for(let i=0;i<n*0.3;i++){const t=i/(n*0.3),y=cy-s*0.5+t*s*0.25;o.push({x:cx+rand(-s*0.3*(1-t),s*0.3*(1-t)),y:y})}for(let i=0;i<n*0.3;i++){const t=i/(n*0.3),y=cy+s*0.25+t*s*0.25;o.push({x:cx+rand(-s*0.3*t,s*0.3*t),y:y})}for(let i=0;i<n*0.1;i++){o.push({x:cx+rand(-s*0.03,s*0.03),y:cy+rand(-s*0.05,s*0.05)})}return o}

// Scorpion
function shapeScorpion(cx,cy,s,n){n=n||300;const o=[];const bl=s*0.7;for(let i=0;i<n*0.2;i++){const t=i/(n*0.2);o.push({x:cx+rand(-s*0.05,s*0.05),y:cy-bl*0.25+t*bl})}for(let side=-1;side<=1;side+=2){for(let i=0;i<n*0.08;i++){const t=i/(n*0.08);o.push({x:cx+side*Math.sin(t*Math.PI)*s*0.25,y:cy-bl*0.2+rand(-2,2)})}}for(let i=0;i<n*0.15;i++){const t=i/(n*0.15),a=Math.PI*0.7+t*Math.PI*0.6;o.push({x:cx+Math.cos(a)*s*0.3,y:cy+bl*0.4+Math.sin(a)*s*0.35})}return o}

// Spider
function shapeSpider(cx,cy,s,n){n=n||300;const o=[];for(let i=0;i<n*0.2;i++){const a=i/(n*0.2)*Math.PI*2;o.push({x:cx+Math.cos(a)*s*0.15,y:cy+Math.sin(a)*s*0.12})}const legs=8;for(let l=0;l<legs;l++){const la=l/legs*Math.PI*2;const lr=s*0.15;for(let i=0;i<n*0.05;i++){const t=i/(n*0.05);const a=la+Math.sin(t*2)*0.5;o.push({x:cx+Math.cos(la)*lr+Math.cos(a)*s*0.3*t,y:cy+Math.sin(la)*lr+Math.sin(a)*s*0.3*t+rand(-1,1)})}}return o}

// Bat
function shapeBat(cx,cy,s,n){n=n||300;const o=[];for(let w=-1;w<=1;w+=2){for(let i=0;i<n*0.3;i++){const t=i/(n*0.3);const x=w*t*s*0.7;const y=cy+Math.sin(t*Math.PI)*s*0.35*(1-t*0.3);o.push({x:cx+x,y:y+rand(-3,3)})}}for(let i=0;i<n*0.1;i++){o.push({x:cx+rand(-s*0.08,s*0.08),y:cy+rand(-s*0.15,s*0.15)})}for(let i=0;i<n*0.1;i++){const a=i/(n*0.1)*Math.PI*2;o.push({x:cx+Math.cos(a)*s*0.08,y:cy-s*0.1+Math.sin(a)*s*0.06})}return o}

// Satellite / antenna dish
function shapeSatellite(cx,cy,s,n){n=n||250;const o=[];for(let i=0;i<n*0.2;i++){const a=Math.PI*0.7+i/(n*0.2)*Math.PI*0.6;o.push({x:cx+Math.cos(a)*s*0.4,y:cy+Math.sin(a)*s*0.35})}for(let i=0;i<n*0.15;i++){o.push({x:cx+rand(-3,3),y:cy+rand(-s*0.3,s*0.3)})}return o}

// Crown (improved)
function shapeCrown2(cx,cy,s,n){n=n||300;const o=[];const cw=s,ch=s*0.6,pts=5;for(let i=0;i<n*0.15;i++){const t=i/(n*0.15);o.push({x:cx-cw+t*cw*2,y:cy+ch*0.35+rand(-s*0.04,s*0.04)})}for(let p=0;p<pts;p++){const px=cx-cw+p/(pts-1)*cw*2;for(let i=0;i<n*0.08;i++){const t=i/(n*0.08);o.push({x:px+rand(-s*0.04,s*0.04),y:cy-ch*0.4*t+rand(-2,2)})}for(let i=0;i<n*0.03;i++){const a=i/(n*0.03)*Math.PI;o.push({x:px+Math.cos(a)*s*0.05,y:cy-ch*0.4-Math.sin(a)*s*0.03})}}for(let i=0;i<n*0.2;i++){o.push({x:cx+rand(-cw,cw),y:cy+rand(-ch*0.35,ch*0.35)})}return o}

// Door / gate
function shapeDoor(cx,cy,s,n){n=n||250;const o=[];const dw=s*0.3,dh=s*0.7;for(let i=0;i<n*0.35;i++){o.push({x:cx+rand(-dw,dw),y:cy+rand(-dh,dh)})}for(let i=0;i<n*0.2;i++){const a=Math.PI+i/(n*0.2)*Math.PI;o.push({x:cx+Math.cos(a)*dw,y:cy-dh+Math.sin(a)*dw*0.4})}return o}

// Window
function shapeWindow(cx,cy,s,n){n=n||250;const o=[];const ww=s*0.35,wh=s*0.4;for(let i=0;i<n*0.2;i++){o.push({x:cx+rand(-ww,ww),y:cy+rand(-wh,wh)})}for(let i=0;i<n*0.1;i++){o.push({x:cx+rand(-2,2),y:cy+rand(-wh,wh)})}for(let i=0;i<n*0.1;i++){o.push({x:cx+rand(-ww,ww),y:cy+rand(-2,2)})}return o}

// Ladder
function shapeLadder(cx,cy,s,n){n=n||250;const o=[];for(let side=-1;side<=1;side+=2){for(let i=0;i<n*0.15;i++){const t=i/(n*0.15);o.push({x:cx+side*s*0.12,y:cy-s*0.5+t*s})}}const rungs=6;for(let r=0;r<rungs;r++){const ry=cy-s*0.4+r/(rungs-1)*s*0.8;for(let i=0;i<n*0.05;i++){o.push({x:cx+rand(-s*0.12,s*0.12),y:ry+rand(-2,2)})}}return o}

// ─── ANIMATION STYLES — Different ways shapes move ──────────────────────────
// Each animation function takes (pt, i, time, shapeSize) → {x, y}

function animNone(pt){return{x:pt.x,y:pt.y}}
function animFloat(pt,i,time){const a=Math.sin(time*0.5+i*0.03)*6;return{x:pt.x+a*0.5,y:pt.y+Math.cos(time*0.5+i*0.03)*6}}
function animPulse(pt,i,time,cx,cy){const p=1+Math.sin(time*2.5)*0.05;return{x:cx+(pt.x-cx)*p,y:cy+(pt.y-cy)*p}}
function animRotate(pt,i,time,cx,cy){const rot=time*0.3;return{x:cx+(pt.x-cx)*Math.cos(rot)-(pt.y-cy)*Math.sin(rot),y:cy+(pt.x-cx)*Math.sin(rot)+(pt.y-cy)*Math.cos(rot)}}
function animFloatRotate(pt,i,time,cx,cy){const rot=time*0.2;const rx=cx+(pt.x-cx)*Math.cos(rot)-(pt.y-cy)*Math.sin(rot);const ry=cy+(pt.x-cx)*Math.sin(rot)+(pt.y-cy)*Math.cos(rot);return{x:rx+Math.sin(time*0.6+i*0.04)*5,y:ry+Math.cos(time*0.6+i*0.04)*5}}
function animFlicker(pt,i,time){const f=Math.sin(time*14+i*0.3)*5;return{x:pt.x+f*0.6,y:pt.y+Math.cos(time*12+i*0.25)*4}}
function animRise(pt,i,time){return{x:pt.x+Math.sin(time*0.5+i*0.02)*8,y:pt.y-Math.sin(time*0.4)*25}}
function animSwirl(pt,i,time,cx,cy){const a=time*0.4+Math.atan2(pt.y-cy,pt.x-cx);const d=Math.hypot(pt.x-cx,pt.y-cy);return{x:cx+Math.cos(a)*d+Math.sin(time+i*0.05)*4,y:cy+Math.sin(a)*d+Math.cos(time+i*0.05)*4}}
function animWaveX(pt,i,time){return{x:pt.x+Math.sin(time*1.5+i*0.05)*15,y:pt.y+Math.cos(time*1.2+i*0.04)*8}}
function animDrop(pt,i,time){const f=i%3;const speed=60+f*25;const y=((i*10+time*speed)%(H+150))-75;return{x:pt.x+Math.sin(time*3+f)*5,y:y}}

// ─── ENHANCED THEME FACTORY WITH ANIMATION SUPPORT ──────────────────────────
function TA(name,icon,pal,count,speed,chaos,mf,shapeFn,shapeSize,animFn,bgFn){
  return makeTheme({
    name:name,icon:icon,pal:pal,count:count||450,speed:speed||0.45,chaos:chaos||0.45,mf:mf||0.9,
    get:function(p,i,t,time){
      if(!this._c||this._t!==~~(time*10)){this._c=shapeFn(cx,cy,Math.min(W,H)*(shapeSize||0.38),t);this._t=~~(time*10)}
      const pt=this._c[i%this._c.length];
      const result=(animFn||animFloat)(pt,i,time,cx,cy);
      return result;
    },
    bg:bgFn||function(){}
  })
}

function shapeChess(cx,cy,s,n){n=n||250;const o=[];for(let i=0;i<n*0.4;i++){o.push({x:cx+rand(-s*0.25,s*0.25),y:cy+rand(-s*0.4,s*0.4)})}for(let i=0;i<n*0.15;i++){const a=i/(n*0.15)*Math.PI*2;o.push({x:cx+Math.cos(a)*s*0.08,y:cy-s*0.4+Math.sin(a)*s*0.06})}return o}
