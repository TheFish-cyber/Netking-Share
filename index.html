<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outro Editor Netking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', 'Impact', sans-serif;
            overflow: hidden;
        }

        .outro-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* Hiệu ứng hạt (film grain) bằng canvas phủ */
        #grainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        /* Ánh sáng xoay nền */
        .light-ring {
            position: absolute;
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            animation: spinRing 20s linear infinite;
            z-index: 0;
            filter: blur(40px);
        }

        .light-ring:nth-child(2) {
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
            animation-duration: 15s;
            animation-direction: reverse;
            filter: blur(50px);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        /* Nội dung chính */
        .main-content {
            position: relative;
            z-index: 5;
            text-align: center;
            animation: fadeInUp 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .main-text {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4),
                0 0 80px rgba(255, 215, 0, 0.2);
            position: relative;
            display: inline-block;
            animation: glowPulse 2.5s ease-in-out infinite alternate;
        }

        /* Hiệu ứng shimmer chạy ngang trên chữ */
        .main-text::before {
            content: '';
            position: absolute;
            top: -5%;
            left: -10%;
            width: 120%;
            height: 110%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 30%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0.3) 70%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
            pointer-events: none;
            mix-blend-mode: overlay;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.4); }
            100% { text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.5), 0 0 120px rgba(255, 215, 0, 0.3); }
        }

        .sub-line {
            margin-top: 20px;
            font-size: clamp(1rem, 2.5vw, 2rem);
            font-weight: 300;
            color: #aaa;
            letter-spacing: 12px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInSub 2s 0.6s forwards;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            padding-top: 20px;
            display: inline-block;
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.3);
        }

        @keyframes fadeInSub {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        /* Scanline hiệu ứng */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, 0.03) 3px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 3;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Hiệu ứng flicker nhẹ cuối */
        .flicker {
            animation: flicker 0.15s ease-in-out 3s 2;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="outro-container">
        <!-- Vòng sáng -->
        <div class="light-ring"></div>
        <div class="light-ring"></div>

        <!-- Lớp phủ -->
        <div class="vignette"></div>
        <div class="scanline"></div>
        <canvas id="grainCanvas"></canvas>

        <!-- Nội dung chính -->
        <div class="main-content flicker">
            <div class="main-text">Editor Netking!</div>
            <div class="sub-line">⚡ COME MY WAY ⚡</div>
        </div>
    </div>

    <script>
        (function() {
            // Tạo hiệu ứng hạt (film grain) trên canvas
            const canvas = document.getElementById('grainCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawGrain() {
                const w = canvas.width;
                const h = canvas.height;
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                // Tạo nhiễu trắng đen
                for (let i = 0; i < data.length; i += 4) {
                    const noise = Math.random() * 255;
                    data[i] = noise;        // R
                    data[i+1] = noise;      // G
                    data[i+2] = noise;      // B
                    data[i+3] = 255;        // A
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawGrain);
            }

            drawGrain();

            // Thêm hiệu ứng rung nhẹ cho chữ bằng CSS động (tùy chọn)
            const mainText = document.querySelector('.main-text');
            let time = 0;
            setInterval(() => {
                time += 0.02;
                // Rung siêu nhẹ theo sin
                const x = Math.sin(time * 3) * 0.3;
                const y = Math.cos(time * 2.5) * 0.3;
                mainText.style.transform = `translate(${x}px, ${y}px)`;
            }, 50);

        })();
    </script>

</body>
</html>
