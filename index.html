<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sơn Tùng M-TP Playlist - Netking Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Consolas, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            touch-action: pan-x pan-y;
        }

        .outro-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        #grainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        .light-ring {
            position: absolute;
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            animation: spinRing 20s linear infinite;
            z-index: 0;
            filter: blur(40px);
        }

        .light-ring:nth-child(2) {
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
            animation-duration: 15s;
            animation-direction: reverse;
            filter: blur(50px);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        /* ===== MAIN CONTENT AREA ===== */
        .wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            width: 100%;
            max-height: 95vh;
        }

        .main-content {
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .main-text {
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: clamp(2.2rem, 7vw, 5rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4);
            position: relative;
            display: inline-block;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sub-line {
            margin-top: 5px;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0.9;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 5px;
            display: inline-block;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .char {
            display: inline-block;
            min-width: 0.7em;
            text-align: center;
            color: #fff;
        }

        /* ===== CUSTOM PLAYER PANEL ===== */
        .player-panel {
            width: 100%;
            background: rgba(10, 10, 10, 0.88);
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(12px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .now-playing {
            font-size: 0.85rem;
            color: #00ff66;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 12px #ffd700;
        }

        .btn-retry {
            border-color: #ff3366;
            color: #ff3366;
        }

        .btn-retry:hover {
            background: #ff3366;
            color: #fff;
            box-shadow: 0 0 12px #ff3366;
        }

        .search-box {
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .custom-playlist {
            position: relative;
            min-height: 140px;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.4);
        }

        .custom-playlist::-webkit-scrollbar {
            width: 4px;
        }
        .custom-playlist::-webkit-scrollbar-thumb {
            background: #00ff66;
            border-radius: 2px;
        }

        .active-indicator {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 35px;
            background: rgba(0, 255, 102, 0.18);
            border-left: 3px solid #00ff66;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.2);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), height 0.2s ease, opacity 0.2s ease;
        }

        .playlist-item {
            position: relative;
            z-index: 2;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .playlist-item:hover {
            color: #fff;
        }

        .playlist-item.active {
            color: #00ff66 !important;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        /* ===== UI TRẠNG THÁI LOADING / ERROR ===== */
        .status-state {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 6px;
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 215, 0, 0.2);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 0.8rem;
            color: #ffd700;
            letter-spacing: 1px;
            text-align: center;
        }

        .error-text {
            color: #ff3366;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.5);
        }

        /* Glitch Corner Text */
        .corner-text {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            opacity: 0.6;
            pointer-events: none;
        }

        .corner-text-left {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-size: clamp(0.6rem, 1vw, 0.8rem);
            color: #888;
            opacity: 0.5;
            pointer-events: none;
        }

        .glitch-active {
            animation: glitchEffect 0.3s steps(1) 1;
        }

        @keyframes glitchEffect {
            0% { transform: translate(0, 0); text-shadow: 2px 0 red, -2px 0 blue; }
            20% { transform: translate(-2px, 1px); text-shadow: -3px 0 cyan, 3px 0 magenta; }
            50% { transform: translate(2px, -1px); text-shadow: 3px 0 lime, -3px 0 red; }
            100% { transform: translate(0, 0); text-shadow: none; }
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0, 0, 0, 0.05) 3px, rgba(0, 0, 0, 0.05) 4px);
            pointer-events: none;
            z-index: 3;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        #youtube-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            left: -9999px;
        }

        /* POPUP IN-APP BROWSER */
        .inapp-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(15px);
            z-index: 99999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .inapp-box {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .inapp-box h2 { color: #ffd700; font-size: 1.2rem; margin-bottom: 12px; text-transform: uppercase; }
        .inapp-box p { font-size: 0.85rem; line-height: 1.5; color: #ddd; margin-bottom: 20px; }
        .arrow-guide { font-size: 2rem; color: #ffd700; animation: bounce 1s infinite alternate; margin-bottom: 10px; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="inapp-modal" id="inAppModal">
        <div class="inapp-box">
            <div class="arrow-guide">↗</div>
            <h2>CẢNH BÁO TRÌNH DUYỆT</h2>
            <p id="inAppMsg">Ứng dụng này chặn nghe nhạc background!<br>Hãy nhấn vào dấu <b>(...)</b> hoặc <b>Chia sẻ</b> ở góc màn hình và chọn <b>"Mở bằng trình duyệt"</b> (Chrome/Safari/Cốc Cốc).</p>
            <button class="btn" onclick="openExternalBrowser()" style="width: 100%; margin-top: 10px;">MỞ TRÌNH DUYỆT NGOÀI</button>
        </div>
    </div>

    <div class="outro-container">
        <div class="light-ring"></div>
        <div class="light-ring"></div>
        <div class="vignette"></div>
        <div class="scanline"></div>
        <canvas id="grainCanvas"></canvas>

        <div class="wrapper">
            <div class="main-content" title="Click để kích hoạt lại Glitch M-TP">
                <div class="main-text" id="mainTextEl">
                    <span class="char">&nbsp;</span>
                    <span style="display:inline-block; min-width:0.3em;">-</span>
                    <span class="char">&nbsp;</span>
                    <span class="char">&nbsp;</span>
                </div>
                <br>
                <div class="sub-line">⚡ NETKING ⚡</div>
            </div>

            <div class="player-panel">
                <div class="now-playing" id="trackTitle">⌛ ĐANG KHỞI TẠO PLAYER...</div>
                
                <div class="controls">
                    <button class="btn" id="prevBtn">◄ PREV</button>
                    <button class="btn" id="playBtn">▶ PLAY</button>
                    <button class="btn" id="nextBtn">NEXT ►</button>
                </div>

                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm kiếm bài hát...">
                </div>

                <div class="custom-playlist" id="playlistContainer">
                    <div class="active-indicator" id="activeIndicator"></div>
                    <div class="status-state" id="statusOverlay">
                        <div class="loading-spinner" id="statusSpinner"></div>
                        <div class="status-text" id="statusText">⚡ ĐANG TẢI BẢNG NHẠC YOUTUBE...</div>
                        <button class="btn btn-retry" id="retryBtn" style="display: none;">🔄 THỬ LẠI KẾT NỐI</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="corner-text" id="cornerRight">
            <span id="glitchRight">● NETKING MTP</span>
        </div>
        <div class="corner-text-left" id="cornerLeft">
            <span id="glitchLeft">#NETKING</span>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        // 1. IN-APP BROWSER DETECTOR
        function detectInAppBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isInApp = /FBAN|FBAV|Instagram|TikTok|Zalo|Telegram|Discord|Line|Twitter|Snapchat|MicroMessenger|Pinterest|FB_IAB/i.test(ua);
            if (isInApp) {
                const modal = document.getElementById('inAppModal');
                const msg = document.getElementById('inAppMsg');
                let appName = "Ứng dụng này";
                if (/FBAN|FBAV|FB_IAB/i.test(ua)) appName = "Facebook";
                else if (/Instagram/i.test(ua)) appName = "Instagram";
                else if (/TikTok/i.test(ua)) appName = "TikTok";
                else if (/Zalo/i.test(ua)) appName = "Zalo";
                else if (/Telegram/i.test(ua)) appName = "Telegram";
                else if (/Discord/i.test(ua)) appName = "Discord";

                msg.innerHTML = `Bạn đang mở web qua <b>${appName}</b> nên không thể phát nhạc YouTube!<br><br>Vui lòng ấn dấu <b>(...)</b> ở góc trên màn hình và chọn <b>"Mở bằng trình duyệt"</b> (Chrome / Safari / Cốc Cốc).`;
                modal.style.display = 'flex';
            }
        }

        function openExternalBrowser() {
            const currentUrl = window.location.href;
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(ua)) {
                window.location.href = "intent://" + currentUrl.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
            } else {
                alert("Hãy nhấn dấu (...) ở góc trên cùng bên phải màn hình -> Chọn 'Mở bằng Safari / Trình duyệt'");
            }
        }

        document.addEventListener('DOMContentLoaded', detectInAppBrowser);

        // 2. KHÓA THAO TÁC / BẢO VỆ WEB
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
                e.preventDefault(); return false;
            }
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) e.preventDefault();
        });
        document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

        // 3. PLAYLIST & YOUTUBE PLAYER WITH STATUS CHECKER
        const playlist = [
            { title: "Nơi Này Có Anh", id: "FN7ALfpGxiI" },
            { title: "Chúng Ta Của Hiện Tại", id: "psZ1g9fMfeo" },
            { title: "Muộn Rồi Mà Sao Còn", id: "xypzmu5mMPY" },
            { title: "Lạc Trôi", id: "Llw9Q6akRo4" },
            { title: "Chạy Ngay Đi", id: "6t-MjBazs3o" },
            { title: "Hãy Trao Cho Anh", id: "knW7-x7Y7RE" },
            { title: "Making My Way", id: "32sYGCOYJUM" },
            { title: "Đừng Làm Trái Tim Anh Đau", id: "niPkap1ozUA" }
        ];

        let currentTrackIndex = 0;
        let player = null;
        let isPlaying = false;
        let loadTimeout = null;

        const statusOverlay = document.getElementById('statusOverlay');
        const statusSpinner = document.getElementById('statusSpinner');
        const statusText = document.getElementById('statusText');
        const retryBtn = document.getElementById('retryBtn');

        function initYouTubePlayer() {
            showLoadingState();
            
            // Timeout 10s: Nếu mạng kém không tải được API sẽ báo lỗi
            clearTimeout(loadTimeout);
            loadTimeout = setTimeout(() => {
                if (!player || typeof player.getPlayerState !== 'function') {
                    showErrorState("KHÔNG THỂ KẾT NỐI TỚI YOUTUBE! VUI LÒNG ĐỔI MẠNG HOẶC THỬ LẠI.");
                }
            }, 10000);

            if (window.YT && window.YT.Player) {
                createPlayer();
            } else {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                document.head.appendChild(tag);
            }
        }

        function onYouTubeIframeAPIReady() {
            createPlayer();
        }

        function createPlayer() {
            try {
                player = new YT.Player('youtube-player', {
                    height: '100', width: '100',
                    videoId: playlist[currentTrackIndex].id,
                    playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                    events: {
                        'onReady': onPlayerReady,
                        'onError': onPlayerError,
                        'onStateChange': onPlayerStateChange
                    }
                });
            } catch (err) {
                showErrorState("LỖI KHỞI TẠO BỘ PHÁT YOUTUBE!");
            }
        }

        function onPlayerReady() {
            clearTimeout(loadTimeout);
            // Kết nối thành công -> Ẩn Overlay và render Playlist
            statusOverlay.style.display = 'none';
            trackTitle.textContent = `🎵 ${playlist[currentTrackIndex].title}`;
            renderPlaylist(playlist);
        }

        function onPlayerError(e) {
            clearTimeout(loadTimeout);
            showErrorState("KHÔNG THỂ TẢI VIDEO YOUTUBE (BỊ CHẶN HOẶC LỖI LINK)!");
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) nextTrack();
        }

        function showLoadingState() {
            statusOverlay.style.display = 'flex';
            statusSpinner.style.display = 'block';
            statusText.className = 'status-text';
            statusText.textContent = "⚡ ĐANG TẢI BẢNG NHẠC YOUTUBE...";
            retryBtn.style.display = 'none';
        }

        function showErrorState(msg) {
            statusOverlay.style.display = 'flex';
            statusSpinner.style.display = 'none';
            statusText.className = 'status-text error-text';
            statusText.textContent = msg;
            retryBtn.style.display = 'inline-block';
            trackTitle.textContent = "❌ LỖI KẾT NỐI NHẠC";
        }

        retryBtn.addEventListener('click', () => {
            initYouTubePlayer();
        });

        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playlistContainer = document.getElementById('playlistContainer');
        const searchInput = document.getElementById('searchInput');
        const trackTitle = document.getElementById('trackTitle');

        function renderPlaylist(items) {
            playlistContainer.innerHTML = '<div class="active-indicator" id="activeIndicator"></div>';
            playlistContainer.appendChild(statusOverlay); // Giữ lại Overlay

            const indicator = document.getElementById('activeIndicator');

            if(items.length === 0) {
                const noItem = document.createElement('div');
                noItem.style.cssText = 'padding:15px; text-align:center; color:#666; font-size:0.8rem;';
                noItem.textContent = 'Không tìm thấy bài hát';
                playlistContainer.appendChild(noItem);
                indicator.style.opacity = '0';
                return;
            }

            items.forEach((track) => {
                const originalIndex = playlist.findIndex(p => p.id === track.id);
                const item = document.createElement('div');
                item.className = `playlist-item ${originalIndex === currentTrackIndex ? 'active' : ''}`;
                item.setAttribute('data-index', originalIndex);
                item.innerHTML = `<span>${originalIndex + 1}. ${track.title}</span> <span>►</span>`;
                
                item.addEventListener('click', () => {
                    playTrack(originalIndex);
                });
                
                playlistContainer.appendChild(item);
            });

            moveIndicator();
        }

        function moveIndicator() {
            const indicator = document.getElementById('activeIndicator');
            const activeItem = playlistContainer.querySelector('.playlist-item.active');
            
            if (activeItem) {
                const topPos = activeItem.offsetTop;
                const height = activeItem.offsetHeight;

                indicator.style.opacity = '1';
                indicator.style.height = `${height}px`;
                indicator.style.transform = `translateY(${topPos}px)`;
            } else {
                indicator.style.opacity = '0';
            }
        }

        function playTrack(index) {
            currentTrackIndex = index;
            if (player && player.loadVideoById) {
                player.loadVideoById(playlist[currentTrackIndex].id);
                if (isPlaying) player.playVideo();
                else player.pauseVideo();
            }
            updateUI();
        }

        function updateUI() {
            trackTitle.textContent = `🎵 ${playlist[currentTrackIndex].title}`;
            
            const items = playlistContainer.querySelectorAll('.playlist-item');
            items.forEach(item => {
                if(parseInt(item.getAttribute('data-index')) === currentTrackIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });

            moveIndicator();
        }

        function getFilteredPlaylist() {
            const query = searchInput.value.toLowerCase().trim();
            return playlist.filter(item => item.title.toLowerCase().includes(query));
        }

        playBtn.addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
                playBtn.textContent = '▶ PLAY';
                isPlaying = false;
            } else {
                player.playVideo();
                playBtn.textContent = '❚❚ PAUSE';
                isPlaying = true;
            }
        });

        nextBtn.addEventListener('click', () => nextTrack());
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentTrackIndex);
        });

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(currentTrackIndex);
        }

        searchInput.addEventListener('input', () => {
            renderPlaylist(getFilteredPlaylist());
        });

        playlistContainer.addEventListener('scroll', () => {
            moveIndicator();
        });

        document.body.addEventListener('click', () => {
            if (player && typeof player.isMuted === 'function' && player.isMuted()) {
                player.unMute();
            }
        }, { once: true });

        // Khởi chạy Player
        initYouTubePlayer();

        // 4. ANIMATION GLITCH M-TP
        (function() {
            const canvas = document.getElementById('grainCanvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawGrain() {
                const w = canvas.width, h = canvas.height;
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = Math.random() * 255;
                    data[i] = data[i+1] = data[i+2] = noise;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawGrain);
            }
            drawGrain();

            const randomChars = '!@#$%^&*()_+-=[]{}|;:,.<>?/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const charElements = document.querySelectorAll('.char'); 
            const mainTextEl = document.getElementById('mainTextEl');
            const targetChars = ['M', 'T', 'P'];
            let isAnimating = false;

            function startGlitchToMTP() {
                if (isAnimating) return;
                isAnimating = true;
                mainTextEl.style.opacity = '1';

                let currentCharIndex = 0;

                function processNextChar() {
                    if (currentCharIndex >= charElements.length) {
                        isAnimating = false;
                        return;
                    }

                    const el = charElements[currentCharIndex];
                    const finalChar = targetChars[currentCharIndex];
                    let step = 0;
                    const maxSteps = 10;

                    const interval = setInterval(() => {
                        if (step >= maxSteps) {
                            clearInterval(interval);
                            el.textContent = finalChar;
                            currentCharIndex++;
                            setTimeout(processNextChar, 80);
                            return;
                        }
                        el.textContent = randomChars[Math.floor(Math.random() * randomChars.length)];
                        step++;
                    }, 50);
                }

                processNextChar();
            }

            setTimeout(startGlitchToMTP, 800);

            document.querySelector('.main-content').addEventListener('click', () => {
                if(isAnimating) return;
                mainTextEl.style.opacity = '0';
                setTimeout(startGlitchToMTP, 200);
            });

            const phrasesRight = ['● NETKING MTP', '✦ SON TUNG M-TP', '★ NETKING', '◆ SKY CƠN MƯA'];
            const elRight = document.getElementById('glitchRight');
            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % phrasesRight.length;
                elRight.textContent = phrasesRight[idx];
                elRight.classList.add('glitch-active');
                setTimeout(() => elRight.classList.remove('glitch-active'), 300);
            }, 2200);
        })();
    </script>
</body>
