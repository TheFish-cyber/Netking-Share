<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outro Editor Netking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', 'Impact', sans-serif;
            overflow: hidden;
        }

        .outro-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* Hiệu ứng hạt (film grain) */
        #grainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        /* Ánh sáng xoay */
        .light-ring {
            position: absolute;
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            animation: spinRing 20s linear infinite;
            z-index: 0;
            filter: blur(40px);
        }

        .light-ring:nth-child(2) {
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
            animation-duration: 15s;
            animation-direction: reverse;
            filter: blur(50px);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        /* Nội dung chính */
        .main-content {
            position: relative;
            z-index: 5;
            text-align: center;
            animation: fadeInUp 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .main-text {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4),
                0 0 80px rgba(255, 215, 0, 0.2);
            position: relative;
            display: inline-block;
            animation: glowPulse 2.5s ease-in-out infinite alternate;
        }

        .main-text::before {
            content: '';
            position: absolute;
            top: -5%;
            left: -10%;
            width: 120%;
            height: 110%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 30%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0.3) 70%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
            pointer-events: none;
            mix-blend-mode: overlay;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.4); }
            100% { text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.5), 0 0 120px rgba(255, 215, 0, 0.3); }
        }

        .sub-line {
            margin-top: 20px;
            font-size: clamp(1rem, 2.5vw, 2rem);
            font-weight: 300;
            color: #aaa;
            letter-spacing: 12px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInSub 2s 0.6s forwards;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            padding-top: 20px;
            display: inline-block;
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.3);
        }

        @keyframes fadeInSub {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        /* Scanline */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, 0.03) 3px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 3;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .flicker {
            animation: flicker 0.15s ease-in-out 3s 2;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ===== Mỗi ký tự trong "Netking" ===== */
        .char {
            display: inline-block;
            min-width: 0.7em;
            text-align: center;
            transition: none;
            color: #fff;
        }

        /* ===== CÁC GÓC CHỮ NHỎ (giữ nguyên) ===== */
        .corner-text {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 10;
            font-size: clamp(0.8rem, 1.5vw, 1.2rem);
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: right;
            opacity: 0.7;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
            mix-blend-mode: screen;
        }

        .corner-text .glitch-word {
            display: inline-block;
            transition: all 0.05s ease;
            position: relative;
        }

        .corner-text .glitch-word.glitch-active {
            animation: glitchEffect 0.4s steps(1) 1;
        }

        @keyframes glitchEffect {
            0% { transform: translate(0, 0); text-shadow: 2px 0 red, -2px 0 blue; clip-path: inset(0 0 0 0); }
            10% { transform: translate(-2px, 1px); text-shadow: -3px 0 cyan, 3px 0 magenta; clip-path: inset(10% 0 20% 0); }
            20% { transform: translate(3px, -1px); text-shadow: 4px 0 lime, -4px 0 red; clip-path: inset(40% 0 10% 0); }
            30% { transform: translate(-1px, 2px); text-shadow: -2px 0 yellow, 2px 0 blue; clip-path: inset(70% 0 5% 0); }
            40% { transform: translate(0, 0); text-shadow: 0 0 8px rgba(255,255,255,0.8); clip-path: inset(0 0 0 0); }
            50% { transform: translate(1px, -2px); text-shadow: 3px 0 red, -3px 0 blue; clip-path: inset(20% 0 30% 0); }
            60% { transform: translate(-2px, 0); text-shadow: -4px 0 cyan, 4px 0 magenta; clip-path: inset(50% 0 20% 0); }
            70% { transform: translate(2px, 1px); text-shadow: 2px 0 lime, -2px 0 red; clip-path: inset(10% 0 60% 0); }
            80% { transform: translate(-1px, -1px); text-shadow: -3px 0 yellow, 3px 0 blue; clip-path: inset(80% 0 5% 0); }
            90% { transform: translate(0, 0); text-shadow: 0 0 12px rgba(255,215,0,0.8); clip-path: inset(0 0 0 0); }
            100% { transform: translate(0, 0); text-shadow: none; clip-path: inset(0 0 0 0); }
        }

        .corner-text-left {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            font-size: clamp(0.6rem, 1vw, 0.9rem);
            font-weight: 300;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.5;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px rgba(0,180,255,0.2);
            mix-blend-mode: screen;
        }

        .corner-text-left .glitch-word-small {
            display: inline-block;
            transition: all 0.1s ease;
        }

        .corner-text-left .glitch-word-small.glitch-active {
            animation: glitchEffectSmall 0.5s steps(1) 1;
        }

        @keyframes glitchEffectSmall {
            0% { transform: translate(0, 0); text-shadow: 1px 0 red, -1px 0 blue; }
            20% { transform: translate(-1px, 1px); text-shadow: -2px 0 cyan, 2px 0 magenta; }
            40% { transform: translate(2px, -1px); text-shadow: 2px 0 lime, -2px 0 red; }
            60% { transform: translate(-1px, -1px); text-shadow: -2px 0 yellow, 2px 0 blue; }
            80% { transform: translate(1px, 0); text-shadow: 1px 0 red, -1px 0 blue; }
            100% { transform: translate(0, 0); text-shadow: none; }
        }

        @media (max-width: 600px) {
            .corner-text { bottom: 20px; right: 20px; font-size: 0.7rem; }
            .corner-text-left { top: 15px; left: 15px; font-size: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="outro-container">
        <!-- Vòng sáng -->
        <div class="light-ring"></div>
        <div class="light-ring"></div>

        <!-- Lớp phủ -->
        <div class="vignette"></div>
        <div class="scanline"></div>
        <canvas id="grainCanvas"></canvas>

        <!-- Nội dung chính -->
        <div class="main-content flicker">
            <div class="main-text">
                Editor 
                <span id="glitch-wrapper">
                    <span class="char" data-original="N">N</span>
                    <span class="char" data-original="e">e</span>
                    <span class="char" data-original="t">t</span>
                    <span class="char" data-original="k">k</span>
                    <span class="char" data-original="i">i</span>
                    <span class="char" data-original="n">n</span>
                    <span class="char" data-original="g">g</span>
                </span>
                !
            </div>
            <div class="sub-line">⚡ COME MY WAY ⚡</div>
        </div>

        <!-- Các góc chữ nhỏ -->
        <div class="corner-text" id="cornerRight">
            <span class="glitch-word" id="glitchRight">● SƠN TÙNG MTP</span>
        </div>
        <div class="corner-text-left" id="cornerLeft">
            <span class="glitch-word-small" id="glitchLeft">#MTP</span>
        </div>
    </div>

    <script>
        (function() {
            // ===== GRAIN CANVAS =====
            const canvas = document.getElementById('grainCanvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawGrain() {
                const w = canvas.width;
                const h = canvas.height;
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = Math.random() * 255;
                    data[i] = noise;
                    data[i+1] = noise;
                    data[i+2] = noise;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawGrain);
            }
            drawGrain();

            // ===== RUNG NHẸ CHO CHỮ CHÍNH =====
            const mainText = document.querySelector('.main-text');
            let time = 0;
            setInterval(() => {
                time += 0.02;
                const x = Math.sin(time * 3) * 0.3;
                const y = Math.cos(time * 2.5) * 0.3;
                mainText.style.transform = `translate(${x}px, ${y}px)`;
            }, 50);

            // ===== GLITCH CORNER TEXT (giữ nguyên) =====
            const phrasesRight = ['● SƠN TÙNG MTP', '✦ COME MY WAY', '► EDITOR NETKING', '★ M-TP', '◆ SKY CƠN MƯA', '⬡ CHẠY NGAY ĐI'];
            const phrasesLeft = ['#MTP', '#SKY', '#SONTUNG', '#MTPFAN', '#VIP'];
            const elRight = document.getElementById('glitchRight');
            const elLeft = document.getElementById('glitchLeft');
            let indexRight = 0, indexLeft = 0;

            function changeRight() {
                elRight.classList.remove('glitch-active');
                void elRight.offsetWidth;
                indexRight = (indexRight + 1) % phrasesRight.length;
                elRight.textContent = phrasesRight[indexRight];
                elRight.classList.add('glitch-active');
                setTimeout(() => elRight.classList.remove('glitch-active'), 500);
            }
            function changeLeft() {
                elLeft.classList.remove('glitch-active');
                void elLeft.offsetWidth;
                indexLeft = (indexLeft + 1) % phrasesLeft.length;
                elLeft.textContent = phrasesLeft[indexLeft];
                elLeft.classList.add('glitch-active');
                setTimeout(() => elLeft.classList.remove('glitch-active'), 550);
            }
            setInterval(changeRight, 2200);
            setInterval(changeLeft, 2800);
            setTimeout(() => {
                elRight.classList.add('glitch-active');
                elLeft.classList.add('glitch-active');
                setTimeout(() => {
                    elRight.classList.remove('glitch-active');
                    elLeft.classList.remove('glitch-active');
                }, 500);
            }, 500);

            function randomFlicker() {
                const corners = [elRight, elLeft];
                corners.forEach(el => {
                    if (Math.random() > 0.7) {
                        el.style.opacity = '0.2';
                        setTimeout(() => el.style.opacity = '1', 80 + Math.random() * 100);
                    }
                });
            }
            setInterval(randomFlicker, 400);

            // ===== HIỆU ỨNG NHÁY TUẦN TỰ CHO "Netking" (không glitch, chỉ nháy đổi chữ) =====
            const charElements = document.querySelectorAll('.char');
            const glitchChars = ['P', 'O', 'I', 'Q', 'E', 'R', 'A', '&', '$']; // bảng ký tự thay thế
            const originalChars = Array.from(charElements).map(el => el.textContent);

            let isAnimating = false;

            function animateCharSequence() {
                if (isAnimating) return;
                isAnimating = true;

                // Reset tất cả về đúng
                charElements.forEach((el, i) => {
                    el.textContent = originalChars[i];
                });

                // Duyệt từng ký tự
                let currentIndex = 0;

                function processNextChar() {
                    if (currentIndex >= charElements.length) {
                        // Hoàn thành, đợi 3 giây rồi lặp lại
                        setTimeout(() => {
                            isAnimating = false;
                            // Reset all (đảm bảo)
                            charElements.forEach((el, i) => {
                                el.textContent = originalChars[i];
                            });
                            // Tự động chạy lại sau 1s
                            setTimeout(animateCharSequence, 1000);
                        }, 3000);
                        return;
                    }

                    const el = charElements[currentIndex];
                    const original = originalChars[currentIndex];
                    let step = 0;
                    const maxSteps = 10; // số lần nháy (đổi ký tự)

                    const interval = setInterval(() => {
                        if (step >= maxSteps) {
                            clearInterval(interval);
                            // Kết thúc, đặt lại đúng chữ
                            el.textContent = original;
                            // Chờ một chút rồi chuyển sang ký tự tiếp theo
                            setTimeout(() => {
                                currentIndex++;
                                processNextChar();
                            }, 150);
                            return;
                        }

                        // Chọn ngẫu nhiên một ký tự từ bảng
                        const randomChar = glitchChars[Math.floor(Math.random() * glitchChars.length)];
                        // Đổi chữ
                        el.textContent = randomChar;
                        step++;
                    }, 80); // 80ms mỗi bước => tổng ~0.8s cho mỗi ký tự
                }

                // Bắt đầu
                processNextChar();
            }

            // Khởi động lần đầu sau khi trang load
            setTimeout(animateCharSequence, 2000);

            // Click vào main-text để chạy lại (tùy chọn)
            document.querySelector('.main-text').addEventListener('click', function() {
                if (!isAnimating) {
                    animateCharSequence();
                }
            });

        })();
    </script>
</body>
</html>
