<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơn Tùng M-TP Playlist - Outro Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', 'Impact', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .outro-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        #grainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        .light-ring {
            position: absolute;
            width: 80vmin;
            height: 80vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            animation: spinRing 20s linear infinite;
            z-index: 0;
            filter: blur(40px);
        }

        .light-ring:nth-child(2) {
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.12) 0%, transparent 70%);
            animation-duration: 15s;
            animation-direction: reverse;
            filter: blur(50px);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        .main-content {
            position: relative;
            z-index: 5;
            text-align: center;
            animation: fadeInUp 1.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            cursor: pointer;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .main-text {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4),
                0 0 80px rgba(255, 215, 0, 0.2);
            position: relative;
            display: inline-block;
            animation: glowPulse 2.5s ease-in-out infinite alternate;
        }

        .main-text::before {
            content: '';
            position: absolute;
            top: -5%;
            left: -10%;
            width: 120%;
            height: 110%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 30%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0.3) 70%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
            pointer-events: none;
            mix-blend-mode: overlay;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.4); }
            100% { text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.5), 0 0 120px rgba(255, 215, 0, 0.3); }
        }

        .sub-line {
            margin-top: 10px;
            font-size: clamp(0.9rem, 2vw, 1.5rem);
            font-weight: 300;
            color: #aaa;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInSub 2s 0.6s forwards;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            padding-top: 15px;
            display: inline-block;
            text-shadow: 0 0 10px rgba(0, 180, 255, 0.3);
        }

        @keyframes fadeInSub {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, 0.03) 3px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 3;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .char {
            display: inline-block;
            min-width: 0.7em;
            text-align: center;
            transition: none;
            color: #fff;
        }

        /* Glitch Corner Right */
        .corner-text {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 10;
            font-size: clamp(0.8rem, 1.5vw, 1.2rem);
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: right;
            opacity: 0.7;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
            mix-blend-mode: screen;
        }

        .corner-text .glitch-word {
            display: inline-block;
            transition: all 0.05s ease;
            position: relative;
        }

        .corner-text .glitch-word.glitch-active {
            animation: glitchEffect 0.4s steps(1) 1;
        }

        @keyframes glitchEffect {
            0% { transform: translate(0, 0); text-shadow: 2px 0 red, -2px 0 blue; clip-path: inset(0 0 0 0); }
            10% { transform: translate(-2px, 1px); text-shadow: -3px 0 cyan, 3px 0 magenta; clip-path: inset(10% 0 20% 0); }
            20% { transform: translate(3px, -1px); text-shadow: 4px 0 lime, -4px 0 red; clip-path: inset(40% 0 10% 0); }
            30% { transform: translate(-1px, 2px); text-shadow: -2px 0 yellow, 2px 0 blue; clip-path: inset(70% 0 5% 0); }
            40% { transform: translate(0, 0); text-shadow: 0 0 8px rgba(255,255,255,0.8); clip-path: inset(0 0 0 0); }
            50% { transform: translate(1px, -2px); text-shadow: 3px 0 red, -3px 0 blue; clip-path: inset(20% 0 30% 0); }
            60% { transform: translate(-2px, 0); text-shadow: -4px 0 cyan, 4px 0 magenta; clip-path: inset(50% 0 20% 0); }
            70% { transform: translate(2px, 1px); text-shadow: 2px 0 lime, -2px 0 red; clip-path: inset(10% 0 60% 0); }
            80% { transform: translate(-1px, -1px); text-shadow: -3px 0 yellow, 3px 0 blue; clip-path: inset(80% 0 5% 0); }
            90% { transform: translate(0, 0); text-shadow: 0 0 12px rgba(255,215,0,0.8); clip-path: inset(0 0 0 0); }
            100% { transform: translate(0, 0); text-shadow: none; clip-path: inset(0 0 0 0); }
        }

        /* Glitch Corner Left */
        .corner-text-left {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            font-size: clamp(0.6rem, 1vw, 0.9rem);
            font-weight: 300;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.5;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px rgba(0,180,255,0.2);
            mix-blend-mode: screen;
        }

        .corner-text-left .glitch-word-small {
            display: inline-block;
            transition: all 0.1s ease;
        }

        .corner-text-left .glitch-word-small.glitch-active {
            animation: glitchEffectSmall 0.5s steps(1) 1;
        }

        @keyframes glitchEffectSmall {
            0% { transform: translate(0, 0); text-shadow: 1px 0 red, -1px 0 blue; }
            20% { transform: translate(-1px, 1px); text-shadow: -2px 0 cyan, 2px 0 magenta; }
            40% { transform: translate(2px, -1px); text-shadow: 2px 0 lime, -2px 0 red; }
            60% { transform: translate(-1px, -1px); text-shadow: -2px 0 yellow, 2px 0 blue; }
            80% { transform: translate(1px, 0); text-shadow: 1px 0 red, -1px 0 blue; }
            100% { transform: translate(0, 0); text-shadow: none; }
        }

        /* ===== MUSIC PLAYER CONTROLS & PLAYLIST ===== */
        .player-panel {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            background: rgba(15, 15, 15, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 320px;
            width: calc(100% - 60px);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            font-family: 'Courier New', monospace;
        }

        .now-playing {
            font-size: 0.85rem;
            color: #ffd700;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 10px #ffd700;
            border-color: #ffd700;
        }

        .playlist-select {
            width: 100%;
            background: #111;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        .playlist-select option {
            background: #111;
            color: #fff;
        }

        /* Khung chứa Youtube Iframe Ẩn */
        #youtube-player {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
        }

        @media (max-width: 600px) {
            .corner-text { bottom: 20px; right: 20px; font-size: 0.7rem; }
            .corner-text-left { top: 15px; left: 15px; font-size: 0.5rem; }
            .player-panel { left: 50%; transform: translateX(-50%); bottom: 20px; max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="outro-container">
        <div class="light-ring"></div>
        <div class="light-ring"></div>

        <div class="vignette"></div>
        <div class="scanline"></div>
        <canvas id="grainCanvas"></canvas>

        <div class="main-content" title="Click để chạy lại Animation M-TP">
            <div class="main-text">
                <span class="char">M</span>
                <span style="display:inline-block; min-width:0.3em;">-</span>
                <span class="char">T</span>
                <span class="char">P</span>
            </div>
            <br>
            <div class="sub-line">⚡ COME MY WAY ⚡</div>
        </div>

        <div class="corner-text" id="cornerRight">
            <span class="glitch-word" id="glitchRight">● SƠN TÙNG MTP</span>
        </div>
        <div class="corner-text-left" id="cornerLeft">
            <span class="glitch-word-small" id="glitchLeft">#MTP</span>
        </div>

        <div class="player-panel">
            <div class="now-playing" id="trackTitle">Đang tải danh sách nhạc...</div>
            <div class="controls">
                <button class="btn" id="prevBtn">◄ PREV</button>
                <button class="btn" id="playBtn">▶ PLAY</button>
                <button class="btn" id="nextBtn">NEXT ►</button>
            </div>
            <select class="playlist-select" id="playlistSelect">
                </select>
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        // ===== DANH SÁCH BÀI HÁT (Thêm/Sửa YouTube Video ID tại đây) =====
        const playlist = [
            { title: "Đừng Làm Trái Tim Anh Đau", id: "abPmZCZZrFA" },
            { title: "Chúng Ta Của Tương Lai", id: "0pWsCiO1-mE" },
            { title: "Making My Way", id: "N36-o42mDdc" },
            { title: "Chạy Ngay Đi (Run Now)", id: "32s188T70vU" },
            { title: "Hãy Trao Cho Anh", id: "knW7-J7ORjU" },
            { title: "Lạc Trôi", id: "Llw9Q6akRo4" },
            { title: "Có Chắc Yêu Là Đây", id: "c183BI__I_8" },
            { title: "Muộn Rồi Mà Sao Còn", id: "xypzmu5mMPY" }
        ];

        let currentTrackIndex = 0;
        let player = null;
        let isPlaying = false;

        // ===== YOUTUBE IFRAME API =====
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: playlist[currentTrackIndex].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            updateUI();
        }

        function onPlayerStateChange(event) {
            // Khi bài hát kết thúc (YT.PlayerState.ENDED = 0), chuyển bài kế tiếp
            if (event.data === YT.PlayerState.ENDED) {
                nextTrack();
            }
        }

        // ===== CONTROL LOGIC =====
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playlistSelect = document.getElementById('playlistSelect');
        const trackTitle = document.getElementById('trackTitle');

        // Populate Playlist vào Dropdown
        playlist.forEach((track, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${index + 1}. ${track.title}`;
            playlistSelect.appendChild(opt);
        });

        function loadTrack(index) {
            currentTrackIndex = index;
            playlistSelect.value = index;
            if (player && player.loadVideoById) {
                player.loadVideoById(playlist[currentTrackIndex].id);
                isPlaying = true;
                playBtn.textContent = '❚❚ PAUSE';
            }
            updateUI();
        }

        function updateUI() {
            trackTitle.textContent = `🎵 ${playlist[currentTrackIndex].title}`;
            // Cập nhật mảng glitch ở góc bên phải chứa luôn bài hát hiện tại
            phrasesRight[0] = `► ${playlist[currentTrackIndex].title.toUpperCase()}`;
        }

        playBtn.addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
                playBtn.textContent = '▶ PLAY';
                isPlaying = false;
            } else {
                player.playVideo();
                playBtn.textContent = '❚❚ PAUSE';
                isPlaying = true;
            }
        });

        nextBtn.addEventListener('click', () => {
            nextTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
        });

        playlistSelect.addEventListener('change', (e) => {
            loadTrack(parseInt(e.target.value));
        });

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
        }


        // ===== CANVAS BACKGROUND & EFFECTS =====
        (function() {
            const canvas = document.getElementById('grainCanvas');
            const ctx = canvas.getContext('2d');
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function drawGrain() {
                const w = canvas.width;
                const h = canvas.height;
                const imageData = ctx.createImageData(w, h);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = Math.random() * 255;
                    data[i] = noise;
                    data[i+1] = noise;
                    data[i+2] = noise;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawGrain);
            }
            drawGrain();

            // Rung nhẹ cho chữ chính
            const mainText = document.querySelector('.main-text');
            let time = 0;
            setInterval(() => {
                time += 0.02;
                const x = Math.sin(time * 3) * 0.3;
                const y = Math.cos(time * 2.5) * 0.3;
                mainText.style.transform = `translate(${x}px, ${y}px)`;
            }, 50);

            // Glitch Text Các Góc
            window.phrasesRight = ['● SƠN TÙNG MTP', '✦ COME MY WAY', '► EDITOR NETKING', '★ M-TP', '◆ SKY CƠN MƯA', '⬡ CHẠY NGAY ĐI'];
            const phrasesLeft = ['#MTP', '#SKY', '#SONTUNG', '#MTPFAN', '#VIP'];
            const elRight = document.getElementById('glitchRight');
            const elLeft = document.getElementById('glitchLeft');
            let indexRight = 0, indexLeft = 0;

            function changeRight() {
                elRight.classList.remove('glitch-active');
                void elRight.offsetWidth;
                indexRight = (indexRight + 1) % phrasesRight.length;
                elRight.textContent = phrasesRight[indexRight];
                elRight.classList.add('glitch-active');
                setTimeout(() => elRight.classList.remove('glitch-active'), 500);
            }
            function changeLeft() {
                elLeft.classList.remove('glitch-active');
                void elLeft.offsetWidth;
                indexLeft = (indexLeft + 1) % phrasesLeft.length;
                elLeft.textContent = phrasesLeft[indexLeft];
                elLeft.classList.add('glitch-active');
                setTimeout(() => elLeft.classList.remove('glitch-active'), 550);
            }
            setInterval(changeRight, 2200);
            setInterval(changeLeft, 2800);

            // Animation Chuyển Chữ M-TP (Outro "Come My Way" Style)
            const charSequence = ['P', 'O', 'I', 'Q', 'E', 'R', 'A', '&', '$'];
            const charElements = document.querySelectorAll('.char'); // M, T, P
            const originalChars = ['M', 'T', 'P'];
            let completed = false;

            function animateCharSequence() {
                if (completed) return;

                charElements.forEach((el, i) => {
                    el.textContent = originalChars[i];
                });

                let currentCharIndex = 0;

                function processNextChar() {
                    if (currentCharIndex >= charElements.length) {
                        completed = true;
                        return;
                    }

                    const el = charElements[currentCharIndex];
                    const original = originalChars[currentCharIndex];
                    let step = 0;

                    const interval = setInterval(() => {
                        if (step >= charSequence.length) {
                            clearInterval(interval);
                            el.textContent = original;
                            setTimeout(() => {
                                currentCharIndex++;
                                processNextChar();
                            }, 500);
                            return;
                        }
                        el.textContent = charSequence[step];
                        step++;
                    }, 300);
                }

                processNextChar();
            }

            // Kích hoạt animation đổi chữ M-TP sau 3 giây
            setTimeout(animateCharSequence, 3000);

            // Click vào chữ lớn để replay animation M-TP
            document.querySelector('.main-content').addEventListener('click', function() {
                if (!completed) return;
                completed = false;
                charElements.forEach((el, i) => {
                    el.textContent = originalChars[i];
                });
                setTimeout(animateCharSequence, 300);
            });
        })();
    </script>
</body>
</html>
